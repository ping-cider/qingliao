<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>轻聊 · 极简网页聊天</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b5bd6'/%3E%3Cpath d='M18 22h28v16H30l-8 7v-7h-4z' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f5fb; --card:#ffffff; --ink:#1f2233; --muted:#8b90a6; --line:#e9eaf3;
    --accent:#5b5bd6; --accent2:#7c3aed; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);-webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 620px at 8% -12%, #e4e7ff 0%, rgba(228,231,255,0) 62%),
      radial-gradient(900px 560px at 96% -6%, #ffe6f4 0%, rgba(255,230,244,0) 58%),
      var(--bg);
  }
  .app{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}
  .is-hidden{display:none!important}

  /* ---------- 进入房间 ---------- */
  .card{
    width:min(430px,100%);background:var(--card);border-radius:26px;padding:30px 26px 22px;
    box-shadow:0 24px 60px rgba(31,34,51,.12), 0 2px 6px rgba(31,34,51,.05);
    border:1px solid rgba(255,255,255,.8);
  }
  .logo{
    width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:26px;background:linear-gradient(135deg,#5b5bd6,#7c3aed);
    box-shadow:0 10px 22px rgba(91,91,214,.28);margin-bottom:14px;
  }
  .card h1{margin:0 0 6px;font-size:23px;letter-spacing:.5px}
  .lead{margin:0 0 20px;color:var(--muted);font-size:13.5px;line-height:1.65}
  .field{display:block;margin-bottom:14px}
  .field>span{display:block;font-size:12.5px;color:#6b7089;margin:0 2px 6px;font-weight:600}
  input[type=text]{
    width:100%;height:46px;border:1px solid var(--line);background:#f8f8fd;border-radius:13px;
    padding:0 14px;font:inherit;font-size:16px;color:var(--ink);outline:none;transition:.15s;
  }
  input[type=text]:focus{background:#fff;border-color:#c7c7f5;box-shadow:0 0 0 4px rgba(91,91,214,.10)}
  .check{display:flex;align-items:center;gap:7px;margin:-2px 2px 14px;font-size:12.5px;color:#6b7089;cursor:pointer;user-select:none}
  .check input{width:15px;height:15px;accent-color:#5b5bd6;margin:0;cursor:pointer;flex:none}
  .row{display:flex;gap:8px}
  .row input{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3px}
  button{font:inherit;cursor:pointer;border:0;transition:.15s;border-radius:13px}
  .primary{
    width:100%;height:48px;margin-top:6px;font-size:15.5px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,#5b5bd6,#7c3aed);box-shadow:0 12px 24px rgba(91,91,214,.26);
  }
  .primary:active{transform:translateY(1px)}
  .primary[disabled]{opacity:.6;box-shadow:none;cursor:default}
  .ghost{background:transparent;color:#5b6076;padding:7px 10px;font-size:13px;border-radius:10px;white-space:nowrap}
  .ghost:hover{background:#f1f1fa;color:var(--ink)}
  .hint{margin:14px 2px 0;font-size:12px;line-height:1.6;color:var(--muted)}
  .err{margin:10px 2px 0;font-size:12.5px;color:var(--bad)}

  /* ---------- 聊天 ---------- */
  .chat{
    width:min(880px,100%);height:min(calc(100dvh - 36px),920px);position:relative;
    background:var(--card);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 24px 60px rgba(31,34,51,.13), 0 2px 6px rgba(31,34,51,.05);
    border:1px solid rgba(255,255,255,.8);
  }
  .topbar{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fff,rgba(255,255,255,.92));backdrop-filter:blur(6px);
  }
  .who{min-width:0;flex:1}
  .room{display:flex;align-items:center;gap:6px;font-weight:650;font-size:15px}
  .room .lock{font-size:12px;opacity:.75}
  .room em{font-style:normal;color:var(--muted);font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;flex:none}
  .dot.online{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.16)}
  .dot.offline{background:var(--bad);box-shadow:0 0 0 3px rgba(239,68,68,.13)}
  .dot.connecting{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .actions{display:flex;gap:2px;flex:none}
  #moreBtn{font-size:16px;line-height:1;letter-spacing:1px;padding:5px 9px}

  .logwrap{flex:1;min-height:0;position:relative;display:flex}
  .log{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 6px;
    display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;
    background:linear-gradient(180deg,#fcfcff, #fff 40%);
  }
  .jump{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
    background:linear-gradient(135deg,#5b5bd6,#7c3aed);color:#fff;
    font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;
    box-shadow:0 10px 24px rgba(91,91,214,.34);
  }
  .jump:hover{filter:brightness(1.06)}
  .jump:active{transform:translateX(-50%) translateY(1px)}
  .empty{margin:auto;text-align:center;color:var(--muted);padding:24px}
  .emptyIcon{font-size:34px;margin-bottom:8px}
  .empty p{margin:4px 0;font-size:14px}
  .empty .small{font-size:12px;opacity:.8}

  .msg{display:flex;flex-direction:column;max-width:min(78%,560px);margin:3px 0;animation:pop .18s ease-out}
  .msg.own{align-self:flex-end;align-items:flex-end}
  .msg.other{align-self:flex-start;align-items:flex-start}
  .name{font-size:12px;color:#767c93;margin:0 5px 3px}
  .bubble{
    padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  }
  .msg.own .bubble{background:linear-gradient(135deg,#5b5bd6,#7c3aed);color:#fff;border-bottom-right-radius:6px;box-shadow:0 8px 18px rgba(91,91,214,.24)}
  .msg.other .bubble{background:#f6f6fc;border:1px solid #ececf6;border-bottom-left-radius:6px}
  .meta{font-size:10.5px;line-height:1.3;color:#b0b4c6;margin:0;white-space:nowrap}
  .status{font-size:10.5px;line-height:1.3;color:#b0b4c6;white-space:nowrap}
  .status.read{color:#7c7cf0}
  .msg.failed .meta{color:var(--bad)}
  .msg.failed .bubble{opacity:.55}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* 消息上的小工具（引用 / 复制） */
  .msg{position:relative}
  .foot{display:flex;align-items:center;gap:8px;margin:2px 6px 3px;min-height:18px}
  .msg.own .foot{flex-direction:row-reverse}
  .tools{display:none;gap:6px}
  .msg.show-tools .tools{display:flex}
  @media (hover:hover){ .msg:hover .tools{display:flex} }
  .tool{background:#ececf8;color:#5b6076;font-size:11px;padding:1px 7px;border-radius:7px;line-height:1.5}
  .tool:hover{background:#dedef4;color:#3f3f6e}

  /* 引用块 */
  .quote{border-left:3px solid rgba(255,255,255,.55);padding:1px 0 2px 8px;margin:0 0 6px;font-size:12.5px;line-height:1.45;opacity:.9;cursor:pointer}
  .msg.other .quote{border-left-color:#c3c6e0}
  .quote .qn{font-weight:650;margin-right:4px}
  .msg.flash .bubble{outline:2px solid #b9b9f0;outline-offset:2px}

  .composer{
    display:flex;gap:10px;align-items:flex-end;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:#fff;position:relative;
  }
  .counter{
    position:absolute;right:16px;bottom:calc(100% + 6px);font-size:10.5px;color:#9aa0b6;
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px;
  }

  /* 引用条 */
  .quotebar{
    display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);
    background:#f7f7fc;
  }
  .quotebar .qb-main{flex:1;min-width:0;border-left:3px solid #b9b9f0;padding-left:9px}
  .qb-name{display:block;font-size:11.5px;font-weight:650;color:#6b7089}
  .qb-text{display:block;font-size:12.5px;color:#8b90a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qb-close{width:28px;height:28px;border-radius:9px;background:transparent;color:#8b90a6;font-size:17px;line-height:1;flex:none}
  .qb-close:hover{background:#ededf9;color:#3f3f6e}

  /* 更多菜单 */
  .menu{
    position:absolute;top:56px;right:12px;z-index:30;width:186px;padding:6px;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 16px 40px rgba(31,34,51,.16);
  }
  .menu-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    padding:9px 10px;border-radius:10px;background:transparent;color:var(--ink);font-size:13.5px;text-align:left;
  }
  .menu-item:hover{background:#f4f4fb}
  .menu-item.danger{color:#d14343}
  .switch{width:32px;height:18px;border-radius:999px;background:#dedee9;position:relative;flex:none;transition:.15s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.15s}
  .menu-item[aria-checked=true] .switch{background:var(--accent)}
  .menu-item[aria-checked=true] .switch::after{left:16px}
  .menu-note{padding:7px 10px 3px;margin-top:4px;border-top:1px solid var(--line);font-size:11px;color:#a3a9bd}
  #msgInput{
    flex:1;resize:none;max-height:132px;min-height:46px;border:1px solid var(--line);background:#f8f8fd;
    border-radius:16px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.45;color:var(--ink);
    outline:none;transition:.15s;
  }
  #msgInput:focus{background:#fff;border-color:#c7c7f5;box-shadow:0 0 0 4px rgba(91,91,214,.10)}
  #msgInput::placeholder{color:#b3b7c9}
  .send{width:auto;height:46px;margin:0;padding:0 20px;flex:none}
  .attach{
    width:46px;height:46px;flex:none;border-radius:14px;background:#f1f1fa;color:#5b6076;
    display:flex;align-items:center;justify-content:center;
  }
  .attach:hover{background:#e5e5f6;color:#3f3f6e}
  .emoji-panel{
    position:absolute;right:10px;bottom:calc(100% + 6px);z-index:25;
    width:min(304px,calc(100vw - 32px));max-height:236px;overflow-y:auto;
    display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 16px 40px rgba(31,34,51,.18);
  }
  .emoji{
    width:100%;aspect-ratio:1;border-radius:8px;background:transparent;
    font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .emoji:hover{background:#f1f1fa}
  .bubble-img{padding:4px;background:#f1f1fa!important;border:1px solid var(--line)!important;box-shadow:none!important}
  .msg.own .bubble-img{background:#f1f1fa!important}
  .img{display:block;max-width:100%;max-height:300px;border-radius:12px;cursor:zoom-in}
  .imghint{font-size:12.5px;color:#8b90a6;padding:10px 12px;text-align:center;min-width:120px}
  .imghint.bad{color:#e05a5a}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;max-width:86vw;
    background:rgba(31,34,51,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;
    box-shadow:0 10px 30px rgba(0,0,0,.22);text-align:center;animation:pop .16s ease-out;
  }

  /* 弹窗 */
  .modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(18,20,28,.42);backdrop-filter:blur(2px)}
  .modal-card{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal-card h3{margin:0 0 12px;font-size:16px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .modal-actions .primary{width:auto;height:38px;margin:0;padding:0 18px;font-size:14px;box-shadow:none}
  .sys{align-self:center;font-size:12px;color:#9aa0b6;background:#f4f4fb;padding:5px 12px;border-radius:999px;margin:8px 0}

  @media (max-width:700px){
    .app{padding:0}
    .chat{height:100dvh;border-radius:0;border:0;box-shadow:none}
    .card{margin:16px}
    .log{padding:14px 12px 4px}
    .msg{max-width:86%}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  }

  /* ---------- 深色模式 ---------- */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1016; --card:#171a23; --ink:#e7e9f3; --muted:#8f96ab; --line:#272c3a;
    }
    body{
      background:
        radial-gradient(1000px 600px at 8% -12%, rgba(64,66,140,.45) 0%, rgba(64,66,140,0) 62%),
        radial-gradient(900px 560px at 96% -6%, rgba(120,40,90,.35) 0%, rgba(120,40,90,0) 58%),
        var(--bg);
    }
    .card,.chat{background:var(--card);border-color:#232837;box-shadow:0 24px 60px rgba(0,0,0,.45)}
    .topbar{background:linear-gradient(180deg,#171a23,rgba(23,26,35,.94));border-bottom-color:var(--line)}
    .log{background:linear-gradient(180deg,#141722,#171a23 40%)}
    .msg.other .bubble{background:#1e2230;border-color:#2a3042;color:var(--ink)}
    .name{color:#9aa1b6}
    .meta{color:#6d748a}
    .status{color:#6d748a}
    .status.read{color:#8f8ff5}
    .msg.own .bubble{box-shadow:0 8px 18px rgba(60,40,140,.45)}
    .field>span,.check{color:#a3a9bd}
    input[type=text]{background:#1b1f2b;border-color:#2a3042;color:var(--ink)}
    input[type=text]:focus{background:#202533;border-color:#4a4ac0}
    #msgInput{background:#1b1f2b;border-color:#2a3042;color:var(--ink)}
    #msgInput:focus{background:#202533;border-color:#4a4ac0}
    #msgInput::placeholder{color:#5f667c}
    .composer{background:var(--card);border-top-color:var(--line)}
    .counter{background:#1e2230;border-color:#2a3042;color:#8f96ab}
    .tool{background:#232838;color:#b9c0d4}
    .tool:hover{background:#2b3145;color:#fff}
    .sys{background:#1e2230;color:#8b93a8}
    .empty{color:var(--muted)}
    .menu{background:#1c2130;border-color:#2a3042;box-shadow:0 16px 40px rgba(0,0,0,.5)}
    .menu-item{color:var(--ink)}
    .menu-item:hover{background:#242a3a}
    .switch{background:#3a4054}
    .ghost{color:#aab1c6}
    .ghost:hover{background:#242a3a;color:#fff}
    .tool{background:#252b3b;color:#b9c0d4}
    .tool:hover{background:#2f3648;color:#fff}
    .attach{background:#252b3b;color:#b9c0d4}
    .attach:hover{background:#2f3648;color:#fff}
    .emoji:hover{background:#252b3b}
    .bubble-img,.msg.own .bubble-img{background:#252b3b!important;border-color:#2a3042!important}
    .msg.other .quote{border-left-color:#4a5270}
    .quotebar{background:#1a1f2c;border-top-color:var(--line)}
    .quotebar .qb-main{border-left-color:#5b5bd6}
    .qb-name{color:#a3a9bd}
    .qb-text{color:#7d8499}
    .qb-close{color:#8f96ab}
    .qb-close:hover{background:#242a3a;color:#fff}
    .toast{background:rgba(230,232,242,.96);color:#14161d}
    .msg.flash .bubble{outline-color:#7c7cf0}
  }
</style>
</head>
<body>
<div class="app">

  <!-- 进入房间 -->
  <section class="card" id="joinScreen">
    <div class="logo" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 11.6c0 4.6-4 8.3-9 8.3-.9 0-1.8-.1-2.6-.4L3.4 21l1.5-4.4A8 8 0 0 1 3 11.6c0-4.6 4-8.3 9-8.3s9 3.7 9 8.3Z" fill="#fff"/>
      </svg>
    </div>
    <h1>轻聊</h1>
    <p class="lead">不用注册、不用装软件。你和对方打开同一个网页、填同一个「房间口令」，就能实时收到对方的消息。</p>
    <form id="joinForm" autocomplete="off">
      <label class="field">
        <span>你的昵称</span>
        <input type="text" id="nickInput" maxlength="12" placeholder="例如：小王">
      </label>
      <label class="field">
        <span>房间口令</span>
        <div class="row">
          <input type="text" id="roomInput" maxlength="40" placeholder="两人必须相同" spellcheck="false">
          <button type="button" class="ghost" id="rollBtn">换一个</button>
        </div>
      </label>
      <label class="check"><input type="checkbox" id="rememberChk"><span>在这台电脑上记住房间口令</span></label>
      <button type="submit" class="primary" id="enterBtn">进入聊天</button>
    </form>
    <p class="err" id="joinErr" hidden></p>
    <p class="hint">口令就是房间钥匙，只有口令相同的人才会进同一个房间；把口令告诉对方即可。消息在浏览器里加密后再转发，中转服务器看不到内容；本机保存的聊天记录同样是密文。</p>
  </section>

  <!-- 聊天 -->
  <section class="chat is-hidden" id="chatScreen">
    <header class="topbar">
      <div class="who">
        <div class="room"><span class="lock" id="lockIcon">🔒</span><span>房间</span><em id="roomName"></em></div>
        <div class="stat"><i class="dot connecting" id="dot"></i><span id="statText">连接中…</span></div>
      </div>
      <div class="actions">
        <button type="button" class="ghost" id="inviteBtn" title="复制邀请信息发给对方">邀请</button>
        <button type="button" class="ghost" id="modeBtn" title="网络不通时可切换连接方式">实时</button>
        <button type="button" class="ghost" id="moreBtn" title="更多选项" aria-haspopup="menu" aria-expanded="false">⋯</button>
        <button type="button" class="ghost" id="leaveBtn" title="回到进入页">退出</button>
      </div>
    </header>

    <div class="menu is-hidden" id="menu" role="menu">
      <button type="button" class="menu-item" id="notifyItem" role="menuitemcheckbox" aria-checked="false">
        <span>消息提醒</span><i class="switch"></i>
      </button>
      <button type="button" class="menu-item" id="soundItem" role="menuitemcheckbox" aria-checked="false">
        <span>提示音</span><i class="switch"></i>
      </button>
      <button type="button" class="menu-item" id="miniItem" role="menuitemcheckbox" aria-checked="false">
        <span>迷你窗口</span><i class="switch"></i>
      </button>
      <button type="button" class="menu-item" id="renameItem" role="menuitem"><span>修改昵称</span></button>
      <button type="button" class="menu-item danger" id="clearBtn" role="menuitem">清空本机记录</button>
      <div class="menu-note" id="menuNote">版本</div>
    </div>

    <div class="logwrap">
      <main class="log" id="log">
        <div class="empty" id="emptyState">
          <div class="emptyIcon">👋</div>
          <p>还没有消息，打个招呼吧</p>
          <p class="small">把房间口令告诉对方，TA 在同一个网页输入后就能收到</p>
        </div>
      </main>
      <button type="button" class="jump is-hidden" id="jumpBtn">有新消息 ↓</button>
    </div>

    <div class="quotebar is-hidden" id="quoteBar">
      <div class="qb-main">
        <span class="qb-name" id="qbName"></span>
        <span class="qb-text" id="qbText"></span>
      </div>
      <button type="button" class="qb-close" id="qbClose" aria-label="取消引用">×</button>

<noscript><p style="text-align:center;padding:20px">这个网页需要浏览器启用 JavaScript 才能使用。</p></noscript>

<script>
(function () {
  'use strict';

  var VERSION = '2.2.0';
  var BASE = 'https://ntfy.sh';        // 消息中转（无需注册的公共服务）
  var MAX_LEN = 800;
  var HIST_MAX = 300;

  var $ = function (id) { return document.getElementById(id); };

  /* ------------------------------------------------------------------ */
  /* 基础工具                                                           */
  /* ------------------------------------------------------------------ */

  // cyrb53：把房间口令稳定地映射成一个短串，作为中转服务上的主题名
  function cyrb53(str, seed) {
    var h1 = 0xdeadbeef ^ (seed || 0);
    var h2 = 0x41c6ce57 ^ (seed || 0);
    for (var i = 0; i < str.length; i++) {
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }

  function topicFor(room) {
    return 'ql-' + Math.floor(cyrb53('qingliao|v1|' + String(room).trim().toLowerCase())).toString(36);
  }

  function randCode() {
    var a = ['blue', 'green', 'happy', 'quiet', 'sunny', 'lucky', 'silver', 'warm', 'bright', 'fresh'];
    var b = ['tiger', 'panda', 'river', 'cloud', 'moon', 'star', 'leaf', 'bird', 'rock', 'wind'];
    var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
    return pick(a) + '-' + pick(b) + '-' + Math.floor(1000 + Math.random() * 9000);
  }

  function uid() {
    try {
      if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    } catch (e) { /* ignore */ }
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function fmtTime(ts) {
    var d = new Date(ts || Date.now());
    var now = new Date();
    var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    var sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    return sameDay ? hm : (pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + hm);
  }

  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.remove('is-hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.add('is-hidden'); }, 2600);
  }

  /* ------------------------------------------------------------------ */
  /* 端到端加密（WebCrypto 不可用时自动降级为明文）                        */
  /* ------------------------------------------------------------------ */

  var HAS_CRYPTO = !!(window.crypto && window.crypto.subtle && window.TextEncoder);
  var TE = window.TextEncoder ? new TextEncoder() : null;
  var TD = window.TextDecoder ? new TextDecoder() : null;

  function toB64(bytes) {
    var out = '';
    var CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) {
      out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(out);
  }

  function fromB64(str) {
    var raw = atob(str);
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }

  function makeKey(room) {
    return window.crypto.subtle
      .importKey('raw', TE.encode('qingliao|' + String(room).trim().toLowerCase()), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: TE.encode('qingliao-salt-v1'), iterations: 120000, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      });
  }

  // 本地聊天记录用另一把由同一口令派生的密钥加密
  function makeHistKey(room) {
    return window.crypto.subtle
      .importKey('raw', TE.encode('qingliao-hist|' + String(room).trim().toLowerCase()), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: TE.encode('qingliao-hist-salt-v1'), iterations: 120000, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      });
  }

  function seal(key, obj) {
    var json = JSON.stringify(obj);
    if (!key) return Promise.resolve('p:' + toB64(TE.encode(json)));
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    return window.crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, TE.encode(json)).then(function (ct) {
      return 'e:' + toB64(iv) + '.' + toB64(new Uint8Array(ct));
    });
  }

  function unseal(key, payload) {
    if (typeof payload !== 'string' || payload.length < 3) return Promise.reject(new Error('bad payload'));
    if (payload.slice(0, 2) === 'p:') {
      return Promise.resolve(JSON.parse(TD.decode(fromB64(payload.slice(2)))));
    }
    if (payload.slice(0, 2) !== 'e:') return Promise.reject(new Error('unknown format'));
    if (!key) return Promise.reject(new Error('no key'));
    var rest = payload.slice(2);
    var dot = rest.indexOf('.');
    if (dot < 0) return Promise.reject(new Error('bad envelope'));
    var iv = fromB64(rest.slice(0, dot));
    var ct = fromB64(rest.slice(dot + 1));
    return window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct).then(function (pt) {
      return JSON.parse(TD.decode(new Uint8Array(pt)));
    });
  }

  /* ------------------------------------------------------------------ */
  /* 运行时状态                                                          */
  /* ------------------------------------------------------------------ */

  var S = {
    nick: '', room: '', topic: '', key: null, histKey: null,
    es: null, pollTimer: null, reconnectTimer: null,
    mode: 'sse',                 // sse | poll
    cursor: '',                  // 最后一条消息 id
    startedAt: 0,
    catchupSince: 0,             // 进房时补收的起点（秒）
    lastBeat: 0,                 // 最近一次收到服务端数据的时间
    quote: null,                 // 正在引用的消息
    audio: null,
    seen: Object.create(null),
    hist: [],
    saveSeq: 0,
    retry: 0,
    unread: 0,
    pending: 0,
    clientId: '',
    connected: false,
    statusKind: 'connecting',
    statusText: '连接中…',
    peerTyping: false,
    typingTimer: null,
    peerReadTs: 0,          // 对方已读到的（我发出的最后一条消息的 ts）
    lastIncomingTs: 0,
    lastTypingSent: 0,
    readTimer: null,
    pendingReadTs: 0,
    lastSender: '',
    lastTs: 0,
    entered: false
  };

  S.clientId = uid();     // 本页面的身份，用来忽略自己消息的回声

  // 本地偏好：消息提醒 / 提示音
  var P = { notify: false, sound: false };
  try {
    var savedPref = JSON.parse(localStorage.getItem('ql.pref') || '{}');
    if (savedPref && typeof savedPref === 'object') {
      P.notify = !!savedPref.notify;
      P.sound = !!savedPref.sound;
    }
  } catch (e) { /* ignore */ }

  function savePref() {
    try { localStorage.setItem('ql.pref', JSON.stringify(P)); } catch (e) { /* ignore */ }
  }

  function ensureAudio() {
    try {
      if (S.audio) return S.audio;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      S.audio = new AC();
      return S.audio;
    } catch (e) { return null; }
  }

  function beep() {
    try {
      var ctx = ensureAudio();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.05, ctx.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + 0.22);
    } catch (e) { /* ignore */ }
  }

  // 页面在后台时才打扰：可选提示音 + 系统通知
  function notifyMessage(msg) {
    if (!document.hidden) return;
    if (P.sound) beep();
    if (!P.notify) return;
    try {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      var n = new Notification(String(msg.n || '对方') + ' · 轻聊', {
        body: msg.k === 'img' ? '[图片]' : String(msg.t).slice(0, 120),
        tag: msg.id,
        silent: true
      });
      n.onclick = function () {
        try { window.focus(); } catch (e) { /* ignore */ }
        n.close();
      };
    } catch (e) { /* ignore */ }
  }

  function setStatus(kind, text) {
    S.statusKind = kind;
    S.statusText = text;
    S.connected = kind === 'online';
    if (S.peerTyping && kind === 'online') return;   // 别把「正在输入」刷掉
    var dot = $('dot');
    dot.className = 'dot ' + kind;
    $('statText').textContent = text;
  }

  /* ------------------------------------------------------------------ */
  /* 正在输入 / 已读（控制消息，不入历史、不缓存）                          */
  /* ------------------------------------------------------------------ */

  function sendControl(payload) {
    if (!S.entered) return;
    payload.v = 1;
    payload.c = S.clientId;      // 用来忽略自己的回声
    payload.at = Date.now();     // 控制消息自身的发送时间（用于丢弃过期的补收）
    payload.id = payload.id || uid();
    S.seen[payload.id] = 1;
    seal(S.key, payload).then(function (body) {
      return fetch(BASE + '/' + encodeURIComponent(S.topic), {
        method: 'POST',
        body: body,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        cache: 'no-store'
      });
    }).catch(function () { /* 控制消息失败无所谓 */ });
  }

  function maybeSendTyping() {
    if (!S.entered) return;
    var now = Date.now();
    if (now - S.lastTypingSent < 2000) return;
    S.lastTypingSent = now;
    sendControl({ k: 't' });
  }

  function showPeerTyping() {
    S.peerTyping = true;
    var dot = $('dot');
    dot.className = 'dot connecting';
    $('statText').textContent = '对方正在输入…';
    clearTimeout(S.typingTimer);
    S.typingTimer = setTimeout(function () {
      S.peerTyping = false;
      setStatus(S.statusKind, S.statusText);
    }, 5000);
  }

  function hidePeerTyping() {
    if (!S.peerTyping) return;
    S.peerTyping = false;
    clearTimeout(S.typingTimer);
    setStatus(S.statusKind, S.statusText);
  }

  function onPeerRead(ts) {
    ts = Number(ts) || 0;
    if (!ts) return;
    if (ts > S.peerReadTs) {
      S.peerReadTs = ts;
      refreshOwnStatus();
    }
  }

  // 只在「我确实看到」时才回已读，短时间内合并
  function scheduleRead(ts) {
    S.lastIncomingTs = Math.max(S.lastIncomingTs, Number(ts) || 0);
    S.pendingReadTs = Math.max(S.pendingReadTs, Number(ts) || 0);
    if (S.readTimer) return;
    S.readTimer = setTimeout(function () {
      S.readTimer = null;
      var t = S.pendingReadTs;
      S.pendingReadTs = 0;
      if (t) sendControl({ k: 'r', ts: t });
    }, 400);
  }

  // 窗口重新可见 / 获得焦点时，把期间收到的消息补一个已读
  function markVisibleRead() {
    if (document.visibilityState !== 'visible' || !document.hasFocus()) return;
    if (S.lastIncomingTs) scheduleRead(S.lastIncomingTs);
  }

  function refreshOwnStatus() {
    var logEl = $('log');
    var old = logEl.querySelectorAll('.status');
    for (var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
    var owns = logEl.querySelectorAll('.msg.own');
    if (!owns.length) return;
    var last = owns[owns.length - 1];
    var t = Number(last.getAttribute('data-ts')) || 0;
    var read = t && S.peerReadTs && t <= S.peerReadTs;
    var foot = last.querySelector('.foot');
    if (!foot) return;
    var st = document.createElement('span');
    st.className = 'status' + (read ? ' read' : '');
    st.textContent = read ? '已读' : '未读';
    foot.appendChild(st);
  }

  /* ------------------------------------------------------------------ */
  /* 记录（本地加密保存，刷新不丢）                                       */
  /* ------------------------------------------------------------------ */

  function histKeyName() { return 'ql.hist.' + S.topic; }

  function saveHist() {
    var seq = ++S.saveSeq;
    var data = S.hist.slice();

    if (!S.histKey) {                       // 不支持加密时退化为明文
      try { localStorage.setItem(histKeyName(), JSON.stringify(data)); } catch (e) { /* ignore */ }
      return Promise.resolve();
    }

    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    return window.crypto.subtle
      .encrypt({ name: 'AES-GCM', iv: iv }, S.histKey, TE.encode(JSON.stringify(data)))
      .then(function (ct) {
        if (seq !== S.saveSeq) return;      // 有更新的快照，丢弃这次
        try {
          localStorage.setItem(histKeyName(), JSON.stringify({
            v: 1,
            iv: toB64(iv),
            ct: toB64(new Uint8Array(ct))
          }));
        } catch (e) { /* 配额满等情况忽略 */ }
      })
      .catch(function () { /* ignore */ });
  }

  function loadHist() {
    S.hist = [];
    var raw = null;
    try { raw = localStorage.getItem(histKeyName()); } catch (e) { raw = null; }
    if (!raw) return Promise.resolve();

    var parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }

    // 旧版本存的是明文数组：直接读出来，并顺便升级成密文
    if (Object.prototype.toString.call(parsed) === '[object Array]') {
      S.hist = parsed.slice(-HIST_MAX);
      saveHist();
      return Promise.resolve();
    }

    if (!parsed || typeof parsed !== 'object' || !parsed.iv || !parsed.ct || !S.histKey) {
      return Promise.resolve();
    }

    return window.crypto.subtle
      .decrypt({ name: 'AES-GCM', iv: fromB64(parsed.iv) }, S.histKey, fromB64(parsed.ct))
      .then(function (pt) {
        var arr = JSON.parse(TD.decode(new Uint8Array(pt)));
        if (Object.prototype.toString.call(arr) === '[object Array]') S.hist = arr.slice(-HIST_MAX);
      })
      .catch(function () { S.hist = []; });
  }

  function pushHist(msg) {
    S.hist.push(msg);
    if (S.hist.length > HIST_MAX) S.hist.splice(0, S.hist.length - HIST_MAX);
    saveHist();
  }

  function clearHist() {
    S.saveSeq++;                            // 作废进行中的写入
    try {
      localStorage.removeItem(histKeyName());
      localStorage.setItem('ql.clear.' + S.topic, String(Date.now()));   // 补收时不把清掉的捞回来
    } catch (e) { /* ignore */ }
    S.hist = [];
    S.lastSender = '';
    S.lastTs = 0;
    var logEl = $('log');
    var emptyEl = $('emptyState');
    while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
    emptyEl.classList.remove('is-hidden');
    logEl.appendChild(emptyEl);
    S.pending = 0;
    updateJump();
  }

  /* ------------------------------------------------------------------ */
  /* 界面：消息渲染                                                       */
  /* ------------------------------------------------------------------ */

  function nearBottom() {
    var el = $('log');
    return el.scrollHeight - el.scrollTop - el.clientHeight < 90;
  }

  function scrollDown(instant) {
    var el = $('log');
    requestAnimationFrame(function () {
      var top = el.scrollHeight;
      if (instant) el.style.scrollBehavior = 'auto';
      el.scrollTop = top;
      if (instant) el.style.scrollBehavior = '';
    });
  }

  function addSystem(text) {
    var el = document.createElement('div');
    el.className = 'sys';
    el.textContent = text;
    $('log').appendChild(el);
    scrollDown();
  }

  function renderMessage(msg, own, animate) {
    var empty = $('emptyState');
    if (empty) empty.classList.add('is-hidden');

    var wrap = document.createElement('div');
    wrap.className = 'msg ' + (own ? 'own' : 'other');
    if (animate === false) wrap.style.animation = 'none';
    if (msg.id) wrap.setAttribute('data-id', msg.id);
    if (msg.ts) wrap.setAttribute('data-ts', String(msg.ts));

    var gap = msg.ts && S.lastTs ? (msg.ts - S.lastTs) : 0;
    var showName = !own && (S.lastSender !== msg.n || gap > 5 * 60 * 1000);

    if (showName) {
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = msg.n || '对方';
      wrap.appendChild(name);
    }

    var bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (msg.k === 'img') {
      bubble.classList.add('bubble-img');
      var img = document.createElement('img');
      img.className = 'img';
      img.alt = '图片';
      img.addEventListener('click', function (ev) {
        ev.stopPropagation();
        try { window.open(img.src, '_blank'); } catch (e) { /* ignore */ }
      });
      bubble.appendChild(img);
      if (msg.local) {
        img.src = msg.local;
      } else {
        loadImageInto(msg, img, bubble);
      }
      wrap.appendChild(bubble);
      // 图片不提供「复制文字」
      var imgMeta = document.createElement('span');
      imgMeta.className = 'meta';
      imgMeta.textContent = fmtTime(msg.ts);
      var imgFoot = document.createElement('div');
      imgFoot.className = 'foot';
      imgFoot.appendChild(imgMeta);
      var imgTools = document.createElement('div');
      imgTools.className = 'tools';
      var qb = document.createElement('button');
      qb.type = 'button';
      qb.className = 'tool';
      qb.textContent = '引用';
      qb.addEventListener('click', function (ev) {
        ev.stopPropagation();
        startQuote(msg);
        wrap.classList.remove('show-tools');
      });
      imgTools.appendChild(qb);
      imgFoot.appendChild(imgTools);
      wrap.appendChild(imgFoot);

      bubble.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var open = $('log').querySelector('.msg.show-tools');
        if (open && open !== wrap) open.classList.remove('show-tools');
        wrap.classList.toggle('show-tools');
      });

      $('log').appendChild(wrap);
      S.lastSender = own ? '' : (msg.n || '对方');
      S.lastTs = msg.ts || Date.now();
      if (own) refreshOwnStatus();
      return;
    }

    // 引用块
    if (msg.q && msg.q.id) {
      var quoted = document.createElement('div');
      quoted.className = 'quote';
      quoted.title = '点击跳转到原消息';
      var qn = document.createElement('span');
      qn.className = 'qn';
      qn.textContent = (msg.q.n || '对方') + '：';
      var qt = document.createElement('span');
      qt.className = 'qt';
      qt.textContent = String(msg.q.t || '').slice(0, 60);
      quoted.appendChild(qn);
      quoted.appendChild(qt);
      quoted.addEventListener('click', function (ev) {
        ev.stopPropagation();
        jumpTo(msg.q.id);
      });
      bubble.appendChild(quoted);
    }

    bubble.appendChild(document.createTextNode(msg.t));   // 纯文本，天然防注入
    wrap.appendChild(bubble);

    var meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = fmtTime(msg.ts);

    var foot = document.createElement('div');
    foot.className = 'foot';
    foot.appendChild(meta);

    // 引用 / 复制
    var tools = document.createElement('div');
    tools.className = 'tools';
    var btnQuote = document.createElement('button');
    btnQuote.type = 'button';
    btnQuote.className = 'tool';
    btnQuote.textContent = '引用';
    btnQuote.addEventListener('click', function (ev) {
      ev.stopPropagation();
      startQuote(msg);
      wrap.classList.remove('show-tools');
    });
    var btnCopy = document.createElement('button');
    btnCopy.type = 'button';
    btnCopy.className = 'tool';
    btnCopy.textContent = '复制';
    btnCopy.addEventListener('click', function (ev) {
      ev.stopPropagation();
      copyText(msg.t).then(function (ok) {
        toast(ok ? '已复制这条消息' : '复制失败，请手动选中');
      });
      wrap.classList.remove('show-tools');
    });
    tools.appendChild(btnQuote);
    tools.appendChild(btnCopy);
    foot.appendChild(tools);
    wrap.appendChild(foot);

    bubble.addEventListener('click', function (ev) {
      if (wrap.classList.contains('failed')) return;   // 失败消息的点击交给外层重发
      ev.stopPropagation();
      var open = $('log').querySelector('.msg.show-tools');
      if (open && open !== wrap) open.classList.remove('show-tools');
      wrap.classList.toggle('show-tools');
    });

    $('log').appendChild(wrap);

    S.lastSender = own ? '' : (msg.n || '对方');
    S.lastTs = msg.ts || Date.now();

    if (own) refreshOwnStatus();     // 只在自己最后一条上标「未读/已读」
  }

  /* ------------------------------------------------------------------ */
  /* 引用 / 跳转                                                         */
  /* ------------------------------------------------------------------ */

  function startQuote(msg) {
    if (!msg || !msg.id) return;
    var label = msg.k === 'img' ? '[图片]' : String(msg.t || '');
    S.quote = { id: msg.id, n: String(msg.n || '对方').slice(0, 24), t: label.slice(0, 80) };
    $('qbName').textContent = (msg.n || '对方') + '：';
    $('qbText').textContent = label.slice(0, 80);
    $('quoteBar').classList.remove('is-hidden');
    $('msgInput').focus();
    scrollDown(true);
  }

  function clearQuote() {
    S.quote = null;
    $('quoteBar').classList.add('is-hidden');
  }

  function jumpTo(id) {
    var el = $('log').querySelector('[data-id="' + id + '"]');
    if (!el) { toast('这条消息不在本机记录里'); return; }
    try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
    el.classList.add('flash');
    setTimeout(function () { el.classList.remove('flash'); }, 1200);
  }

  /* ------------------------------------------------------------------ */
  /* 网络：接收                                                          */
  /* ------------------------------------------------------------------ */

  function handleRaw(text) {
    var raw;
    try { raw = JSON.parse(text); } catch (e) { return; }
    if (!raw || raw.event !== 'message') return;
    if (raw.attachment) return;                 // 图片原始上传产生的那条消息，忽略
    if (typeof raw.message !== 'string' || !raw.message) return;
    if (raw.id && S.seen[raw.id]) return;
    if (raw.id) {
      S.seen[raw.id] = 1;
      S.cursor = raw.id;
    }

    return unseal(S.key, raw.message).then(function (env) {
      if (env && (env.k === 't' || env.k === 'r')) {
        if (env.c && env.c === S.clientId) return;                    // 自己发的回声
        if (Date.now() - (Number(env.at) || 0) > 20000) return;       // 补收回来的旧控制消息，丢掉
        if (env.k === 't') { showPeerTyping(); return; }              // 对方正在输入
        if (env.k === 'r') { onPeerRead(env.ts); return; }            // 对方已读
        return;
      }
      if (!env || (!env.t && env.k !== 'img')) return;
      if (env.id && S.seen[env.id]) return;
      if (env.id) S.seen[env.id] = 1;

      var msg;
      if (env.k === 'img') {
        if (!env.u || !env.iv) return;
        msg = {
          id: env.id || raw.id || uid(),
          n: String(env.n || '对方').slice(0, 24),
          ts: Number(env.ts) || (raw.time ? raw.time * 1000 : Date.now()),
          k: 'img',
          u: String(env.u),
          iv: String(env.iv),
          w: Number(env.w) || 0,
          h: Number(env.h) || 0
        };
      } else {
        msg = {
          id: env.id || raw.id || uid(),
          n: String(env.n || '对方').slice(0, 24),
          t: String(env.t).slice(0, MAX_LEN),
          ts: Number(env.ts) || (raw.time ? raw.time * 1000 : Date.now())
        };
      }
      if (env.q && env.q.id) {
        msg.q = {
          id: String(env.q.id).slice(0, 64),
          n: String(env.q.n || '').slice(0, 24),
          t: String(env.q.t || '').slice(0, 80)
        };
      }
      var wasNear = nearBottom();
      renderMessage(msg, false, true);
      pushHist(msg);
      hidePeerTyping();
      S.lastIncomingTs = Math.max(S.lastIncomingTs, msg.ts || 0);
      if (document.visibilityState === 'visible' && document.hasFocus()) scheduleRead(msg.ts);
      if (wasNear) {
        scrollDown();
      } else {
        S.pending++;
        updateJump();
      }
      bumpUnread();
      notifyMessage(msg);
    }).catch(function () {
      addSystem('收到一条无法解密的消息（对方的房间口令可能不一致）');
    });
  }

  /* ------------------------------------------------------------------ */
  /* 未读计数 + 迷你窗口                                                 */
  /* ------------------------------------------------------------------ */

  var MINI_CSS = [
    'html,body{margin:0;height:100%;overflow:hidden;background:#111318;}',
    'body{display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}',
    '.dot{width:13px;height:13px;border-radius:50%;background:#3b4050;transition:background .15s,box-shadow .15s;}',
    '.dot.hot{background:#ff453a;box-shadow:0 0 0 4px rgba(255,69,58,.16);}'
  ].join('');

  var pipWin = null;
  var faviconOn = null;
  var faviconOff = null;

  function makeFavicon(withDot) {
    try {
      var c = document.createElement('canvas');
      c.width = c.height = 64;
      var x = c.getContext('2d');
      if (!x) return null;
      var g = x.createLinearGradient(0, 0, 64, 64);
      g.addColorStop(0, '#5b5bd6');
      g.addColorStop(1, '#7c3aed');
      x.fillStyle = g;
      var r = 14;
      x.beginPath();
      x.moveTo(r, 0); x.lineTo(64 - r, 0);
      x.quadraticCurveTo(64, 0, 64, r); x.lineTo(64, 64 - r);
      x.quadraticCurveTo(64, 64, 64 - r, 64); x.lineTo(r, 64);
      x.quadraticCurveTo(0, 64, 0, 64 - r); x.lineTo(0, r);
      x.quadraticCurveTo(0, 0, r, 0);
      x.closePath(); x.fill();
      x.fillStyle = '#fff';
      x.beginPath();
      x.moveTo(16, 20); x.lineTo(48, 20);
      x.quadraticCurveTo(52, 20, 52, 24); x.lineTo(52, 38);
      x.quadraticCurveTo(52, 42, 48, 42); x.lineTo(30, 42);
      x.lineTo(22, 48); x.lineTo(22, 42); x.lineTo(16, 42);
      x.quadraticCurveTo(12, 42, 12, 38); x.lineTo(12, 24);
      x.quadraticCurveTo(12, 20, 16, 20);
      x.closePath(); x.fill();
      if (withDot) {
        x.beginPath();
        x.arc(50, 14, 13, 0, Math.PI * 2);
        x.fillStyle = '#ff453a';
        x.fill();
      }
      return c.toDataURL('image/png');
    } catch (e) { return null; }
  }

  function setFavicon(hot) {
    try {
      if (!faviconOff) { faviconOff = makeFavicon(false); faviconOn = makeFavicon(true); }
      var url = hot ? faviconOn : faviconOff;
      if (!url) return;
      var link = document.querySelector('link[rel="icon"]');
      if (link) link.href = url;
    } catch (e) { /* ignore */ }
  }

  function updateTitle() {
    document.title = S.unread ? '(' + S.unread + ') 轻聊 · 极简网页聊天' : '轻聊 · 极简网页聊天';
    setFavicon(S.unread > 0);
  }

  function renderMini() {
    if (!pipWin || pipWin.closed) return;
    var doc = pipWin.document;
    var dot = doc.getElementById('miniDot');
    if (!dot) return;
    dot.className = S.unread > 0 ? 'dot hot' : 'dot';
  }

  function bumpUnread() {
    if (!document.hidden && document.hasFocus()) return;   // 正看着就不用计数
    S.unread++;
    updateTitle();
    renderMini();
  }

  function clearUnread() {
    if (S.unread === 0) { renderMini(); return; }
    S.unread = 0;
    updateTitle();
    renderMini();
  }

  // 「有新消息 ↓」悬浮按钮：翻历史时有新消息才出现
  function updateJump() {
    var btn = $('jumpBtn');
    if (!btn) return;
    if (S.pending > 0) {
      btn.textContent = (S.pending > 99 ? '99+' : S.pending) + ' 条新消息 ↓';
      btn.classList.remove('is-hidden');
    } else {
      btn.classList.add('is-hidden');
    }
  }

  function resetJump() {
    S.pending = 0;
    updateJump();
  }

  function closeMini() {
    if (pipWin && !pipWin.closed) {
      try { pipWin.close(); } catch (e) { /* ignore */ }
    }
  }

  function toggleMini() {
    var supported = 'documentPictureInPicture' in window;
    if (!supported) {
      toast('这个浏览器不支持迷你窗口（需要 Chrome / Edge 116 以上）');
      return;
    }
    if (pipWin && !pipWin.closed) {
      closeMini();
      return;
    }
    window.documentPictureInPicture.requestWindow({ width: 64, height: 40 }).then(function (win) {
      pipWin = win;
      $('miniItem').setAttribute('aria-checked', 'true');
      try { win.document.title = '·'; } catch (e) { /* ignore */ }

      var style = win.document.createElement('style');
      style.textContent = MINI_CSS;
      win.document.head.appendChild(style);

      var dot = win.document.createElement('div');
      dot.className = 'dot';
      dot.id = 'miniDot';
      win.document.body.appendChild(dot);

      win.document.body.addEventListener('click', function () {
        clearUnread();
        try { window.focus(); } catch (e) { /* ignore */ }
      });
      win.addEventListener('pagehide', function () {
        pipWin = null;
        $('miniItem').setAttribute('aria-checked', 'false');
      });

      renderMini();
      toast('小窗已打开：有未读时亮红点，点一下回到聊天');
    }).catch(function (err) {
      toast('迷你窗口打开失败：' + String((err && err.message) || err));
    });
  }

  function teardown() {
    if (S.es) {
      try { S.es.close(); } catch (e) { /* ignore */ }
      S.es = null;
    }
    if (S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; }
    if (S.reconnectTimer) { clearTimeout(S.reconnectTimer); S.reconnectTimer = null; }
  }

  function scheduleReconnect() {
    if (!S.entered || S.reconnectTimer) return;
    var wait = Math.min(15000, 1200 * Math.pow(1.7, S.retry++));
    setStatus('offline', '已断开，' + Math.round(wait / 1000) + ' 秒后重连…');
    S.reconnectTimer = setTimeout(function () {
      S.reconnectTimer = null;
      connect();
    }, wait);
  }

  function connect() {
    if (!S.entered) return;
    teardown();
    var since = S.cursor || S.catchupSince || Math.floor(S.startedAt / 1000);

    if (S.mode === 'poll') {
      setStatus('connecting', '连接中…');
      pollOnce();
      S.pollTimer = setInterval(pollOnce, 2500);
      return;
    }

    setStatus('connecting', '连接中…');
    var url = BASE + '/' + encodeURIComponent(S.topic) + '/sse?since=' + encodeURIComponent(since);
    var es;
    try {
      es = new EventSource(url);
    } catch (e) {
      setStatus('offline', '无法连接');
      scheduleReconnect();
      return;
    }
    S.es = es;
    S.lastBeat = Date.now();

    es.onopen = function () {
      S.retry = 0;
      S.lastBeat = Date.now();
      setStatus('online', '已连接');
    };
    es.onmessage = function (ev) {
      S.lastBeat = Date.now();
      handleRaw(ev.data);
    };
    try {
      es.addEventListener('keepalive', function () { S.lastBeat = Date.now(); });
      es.addEventListener('open', function () { S.lastBeat = Date.now(); });
    } catch (e) { /* ignore */ }
    es.onerror = function () {
      if (es.readyState === 2) {          // CLOSED：浏览器已经放弃自动重连
        teardown();
        scheduleReconnect();
      } else {
        setStatus('offline', '已断开，正在重连…');
      }
    };
  }

  function pollOnce() {
    if (S.mode !== 'poll' || !S.entered) return;
    var since = S.cursor || Math.floor(S.startedAt / 1000);
    var url = BASE + '/' + encodeURIComponent(S.topic) + '/json?poll=1&since=' + encodeURIComponent(since);
    fetch(url, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (text) {
        setStatus('online', '已连接（兼容模式）');
        S.retry = 0;
        S.lastBeat = Date.now();
        var lines = text.split('\n');
        for (var i = 0; i < lines.length; i++) {
          if (lines[i].trim()) handleRaw(lines[i]);
        }
      })
      .catch(function () {
        setStatus('offline', '连接中断，正在重试…');
      });
  }

  // 长连接可能被代理悄悄掐断（浏览器不报错），这里做心跳看门狗
  setInterval(function () {
    if (!S.entered || S.mode !== 'sse' || !S.es || S.es.readyState !== 1) return;
    if (S.lastBeat && Date.now() - S.lastBeat > 95000) {
      setStatus('offline', '连接可能已失效，正在重连…');
      S.retry = 0;
      connect();
    }
  }, 15000);

  function publish(body) {
    var ctrl = null;
    var opts = {
      method: 'POST',
      body: body,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      cache: 'no-store'
    };
    try {
      ctrl = new AbortController();
      opts.signal = ctrl.signal;
      setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);
    } catch (e) { /* 老浏览器忽略超时 */ }

    return fetch(BASE + '/' + encodeURIComponent(S.topic), opts).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return true;
    });
  }

  /* ------------------------------------------------------------------ */
  /* 图片：压缩 → 加密 → 传到中转附件 → 消息里只带链接                     */
  /* ------------------------------------------------------------------ */

  var IMG_MAX_SIDE = 1600;
  var IMG_QUALITY = 0.85;

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if (!w || !h) throw new Error('图片尺寸异常');
          var scale = Math.min(1, IMG_MAX_SIDE / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var c = document.createElement('canvas');
          c.width = cw;
          c.height = ch;
          var x = c.getContext('2d');
          x.fillStyle = '#ffffff';
          x.fillRect(0, 0, cw, ch);
          x.drawImage(img, 0, 0, cw, ch);
          URL.revokeObjectURL(url);
          c.toBlob(function (blob) {
            if (!blob) { reject(new Error('压缩失败')); return; }
            resolve({ blob: blob, w: cw, h: ch });
          }, 'image/jpeg', IMG_QUALITY);
        } catch (e) {
          URL.revokeObjectURL(url);
          reject(e);
        }
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('不是有效的图片文件'));
      };
      img.src = url;
    });
  }

  function encryptBytes(buf) {
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    return window.crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, S.key, buf).then(function (ct) {
      return { data: new Uint8Array(ct), iv: toB64(iv) };
    });
  }

  function uploadAttachment(bytes) {
    // 图片传到单独的 -f 主题，避免在聊天流里插一条“附件消息”
    return fetch(BASE + '/' + encodeURIComponent(S.topic + '-f'), {
      method: 'POST',
      body: bytes,
      headers: {
        'Filename': uid() + '.bin',
        'Content-Type': 'application/octet-stream'
      },
      cache: 'no-store'
    }).then(function (res) {
      if (!res.ok) throw new Error('上传失败 HTTP ' + res.status);
      return res.json();
    }).then(function (json) {
      if (!json || !json.attachment || !json.attachment.url) throw new Error('中转没有返回图片地址');
      return json.attachment.url;
    });
  }

  function loadImageInto(msg, img, bubble) {
    var hint = document.createElement('div');
    hint.className = 'imghint';
    hint.textContent = '图片加载中…';
    bubble.appendChild(hint);

    fetch(msg.u, { cache: 'force-cache' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.arrayBuffer();
      })
      .then(function (buf) {
        return window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(msg.iv) }, S.key, buf);
      })
      .then(function (pt) {
        var blob = new Blob([pt], { type: 'image/jpeg' });
        img.src = URL.createObjectURL(blob);
        if (hint.parentNode) hint.parentNode.removeChild(hint);
      })
      .catch(function () {
        hint.textContent = '图片已过期或加载失败';
        hint.classList.add('bad');
      });
  }

  function sendImage(file) {
    if (!S.entered) return Promise.resolve(false);
    if (!file || !/^image\//.test(file.type || '')) { toast('这个文件不是图片'); return Promise.resolve(false); }
    if (!window.crypto || !window.crypto.subtle || !S.key) {
      toast('当前浏览器环境不支持加密，不能发图片');
      return Promise.resolve(false);
    }
    if (file.size > 15 * 1024 * 1024) { toast('图片太大了（上限 15MB）'); return Promise.resolve(false); }

    var localUrl = null;
    toast('正在处理图片…');

    return compressImage(file).then(function (res) {
      if (res.blob.size > 8 * 1024 * 1024) throw new Error('压缩后仍然太大');
      return res.blob.arrayBuffer().then(function (buf) {
        return encryptBytes(buf).then(function (enc) {
          return uploadAttachment(enc.data).then(function (url) {
            return { url: url, iv: enc.iv, w: res.w, h: res.h };
          });
        });
      });
    }).then(function (info) {
      localUrl = URL.createObjectURL(file);
      var msg = {
        v: 1, id: uid(), n: S.nick, ts: Date.now(), me: 1,
        k: 'img', u: info.url, iv: info.iv, w: info.w, h: info.h
      };
      S.seen[msg.id] = 1;
      renderMessage({ id: msg.id, n: msg.n, ts: msg.ts, k: 'img', u: msg.u, iv: msg.iv, w: msg.w, h: msg.h, local: localUrl }, true, true);
      pushHist(msg);
      scrollDown(true);
      resetJump();
      return seal(S.key, msg).then(publish).then(function () {
        toast('图片已发送');
        return true;
      });
    }).catch(function (err) {
      if (localUrl) { try { URL.revokeObjectURL(localUrl); } catch (e) { /* ignore */ } }
      toast('图片发送失败：' + String((err && err.message) || err));
      return false;
    });
  }

  /* ------------------------------------------------------------------ */
  /* 网络：发送                                                          */
  /* ------------------------------------------------------------------ */

  function sendMessage(text) {
    if (!S.entered) return Promise.resolve(false);
    text = String(text == null ? '' : text).replace(/^\s+|\s+$/g, '').slice(0, MAX_LEN);
    if (!text) return Promise.resolve(false);

    var env = { v: 1, id: uid(), n: S.nick, t: text, ts: Date.now(), me: 1 };
    if (S.quote && S.quote.id) env.q = { id: S.quote.id, n: S.quote.n, t: S.quote.t };
    S.seen[env.id] = 1;

    renderMessage(env, true, true);
    pushHist(env);
    clearQuote();
    scrollDown(true);          // 自己发完消息，始终回到最新
    resetJump();
    setTimeout(function () { scrollDown(true); }, 60);   // 等输入框收回高度后再纠一次

    return seal(S.key, env)
      .then(publish)
      .then(function () {
        if (S.mode === 'sse' && S.es && S.es.readyState === 1) setStatus('online', '已连接');
        return true;
      })
      .catch(function (err) {
        markFailed(env.id);
        var msg = String(err && err.message || err);
        if (msg.indexOf('429') >= 0) toast('发送太频繁了，等几秒再试');
        else if (msg.indexOf('413') >= 0) toast('消息太长，发短一点');
        else toast('发送失败，请检查网络后重试');
        return false;
      });
  }

  function markFailed(id) {
    var el = $('log').querySelector('[data-id="' + id + '"]');
    if (!el) return;
    el.classList.add('failed');
    var meta = el.querySelector('.meta');
    if (meta) meta.textContent = '未发送（点击重试）';
    var st = el.querySelector('.status');
    if (st) st.parentNode.removeChild(st);
    el.style.cursor = 'pointer';
    el.addEventListener('click', function () { retry(id); }, { once: true });
  }

  function retry(id) {
    var msg = null;
    for (var i = 0; i < S.hist.length; i++) if (S.hist[i].id === id) msg = S.hist[i];
    if (!msg) return;
    var el = $('log').querySelector('[data-id="' + id + '"]');
    if (el) {
      el.classList.remove('failed');
      var meta = el.querySelector('.meta');
      if (meta) meta.textContent = fmtTime(msg.ts);
    }
    seal(S.key, msg).then(publish).then(function () {
      toast('已重新发送');
    }).catch(function () {
      markFailed(id);
      toast('还是发不出去，请检查网络');
    });
  }

  /* ------------------------------------------------------------------ */
  /* 进入 / 退出                                                         */
  /* ------------------------------------------------------------------ */

  function showJoinError(text) {
    var el = $('joinErr');
    if (!text) { el.hidden = true; return; }
    el.textContent = text;
    el.hidden = false;
  }

  function enter() {
    if (S.entered) return;
    var nick = $('nickInput').value.replace(/^\s+|\s+$/g, '').slice(0, 12);
    var room = $('roomInput').value.replace(/^\s+|\s+$/g, '');

    if (!nick) { showJoinError('请先填一个昵称'); $('nickInput').focus(); return; }
    if (room.length < 2) { showJoinError('房间口令至少 2 个字符'); $('roomInput').focus(); return; }

    showJoinError('');
    if (room.length < 8) {
      toast('口令偏短：建议至少 8 位，或点「换一个」用随机口令');
    }
    $('enterBtn').disabled = true;
    $('enterBtn').textContent = '正在进入…';

    S.nick = nick;
    S.room = room;
    S.topic = topicFor(room);
    S.startedAt = Date.now();
    S.cursor = '';
    S.seen = Object.create(null);
    S.entered = true;
    S.retry = 0;
    S.lastSender = '';
    S.lastTs = 0;
    S.lastBeat = 0;
    S.unread = 0;
    S.pending = 0;
    S.peerReadTs = 0;
    S.peerTyping = false;
    S.lastIncomingTs = 0;
    S.lastTypingSent = 0;
    S.pendingReadTs = 0;
    clearTimeout(S.typingTimer);
    clearTimeout(S.readTimer);
    S.readTimer = null;
    updateTitle();
    renderMini();
    updateJump();
    clearQuote();
    $('menu').classList.add('is-hidden');
    $('moreBtn').setAttribute('aria-expanded', 'false');
    $('chatScreen').style.height = '';

    try {
      localStorage.setItem('ql.nick', nick);
      if ($('rememberChk') && $('rememberChk').checked) localStorage.setItem('ql.room', room);
      else localStorage.removeItem('ql.room');
    } catch (e) { /* ignore */ }

    $('roomName').textContent = room;

    var ready = HAS_CRYPTO
      ? Promise.all([makeKey(room), makeHistKey(room)]).then(function (keys) {
          S.key = keys[0];
          S.histKey = keys[1];
        }).catch(function () { S.key = null; S.histKey = null; })
      : Promise.resolve();

    ready.then(function () {
      $('lockIcon').textContent = S.key ? '🔒' : '🔓';
      $('lockIcon').title = S.key ? '消息已端到端加密，本地记录也已加密' : '当前浏览器不支持加密，消息与本地记录均为明文';
      $('joinScreen').classList.add('is-hidden');
      $('chatScreen').classList.remove('is-hidden');
      $('enterBtn').disabled = false;
      $('enterBtn').textContent = '进入聊天';

      var logEl = $('log');
      var emptyEl = $('emptyState');
      while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
      emptyEl.classList.remove('is-hidden');
      logEl.appendChild(emptyEl);

      return loadHist();
    }).then(function () {
      for (var i = 0; i < S.hist.length; i++) {
        renderMessage(S.hist[i], S.hist[i].me === 1 || S.hist[i].n === S.nick, false);
      }
      if (S.hist.length) {
        addSystem('以上是这台电脑上保存的历史消息');
        scrollDown();
      }

      // 补收离线期间的消息：从中转缓存里往回捞（最多 12 小时，清空过就从清空时间起算）
      var clearedAt = 0;
      try { clearedAt = Number(localStorage.getItem('ql.clear.' + S.topic)) || 0; } catch (e) { clearedAt = 0; }
      var lastTs = S.hist.length ? (S.hist[S.hist.length - 1].ts || 0) : 0;
      var floorTs = Math.max(Date.now() - 12 * 3600 * 1000, clearedAt, lastTs - 120000);
      S.catchupSince = Math.floor(Math.min(floorTs, Date.now()) / 1000);
      for (var j = 0; j < S.hist.length; j++) {
        if (S.hist[j].id) S.seen[S.hist[j].id] = 1;      // 已有的不重复渲染
      }

      if (!HAS_CRYPTO) toast('浏览器不支持加密，消息将以明文发送');
      connect();
      var touchOnly = false;
      try { touchOnly = window.matchMedia('(hover: none)').matches; } catch (e) { /* ignore */ }
      if (!touchOnly) setTimeout(function () { $('msgInput').focus(); }, 60);
    });
  }

  function leave() {
    S.entered = false;
    teardown();
    S.es = null;
    setStatus('offline', '已退出');
    clearQuote();
    $('menu').classList.add('is-hidden');
    $('moreBtn').setAttribute('aria-expanded', 'false');
    $('chatScreen').style.height = '';
    $('chatScreen').classList.add('is-hidden');
    $('joinScreen').classList.remove('is-hidden');
    S.unread = 0;
    S.pending = 0;
    S.peerTyping = false;
    clearTimeout(S.typingTimer);
    updateTitle();
    renderMini();
    updateJump();
  }

  /* ------------------------------------------------------------------ */
  /* 修改昵称                                                           */
  /* ------------------------------------------------------------------ */

  function openRename() {
    if (!S.entered) return;
    $('renameInput').value = S.nick;
    $('renameModal').classList.remove('is-hidden');
    setTimeout(function () {
      var el = $('renameInput');
      try { el.focus(); el.select(); } catch (e) { /* ignore */ }
    }, 30);
  }

  function closeRename() {
    $('renameModal').classList.add('is-hidden');
  }

  function saveRename() {
    var v = $('renameInput').value.replace(/^\s+|\s+$/g, '').slice(0, 12);
    if (!v) { toast('昵称不能为空'); return; }
    S.nick = v;
    if ($('nickInput')) $('nickInput').value = v;
    try { localStorage.setItem('ql.nick', v); } catch (e) { /* ignore */ }
    closeRename();
    toast('昵称已改为「' + v + '」');
  }

  /* ------------------------------------------------------------------ */
  /* 复制 / 邀请                                                         */
  /* ------------------------------------------------------------------ */

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  function inviteText() {
    var here = location.href.split('#')[0].split('?')[0];
    if (/^https?:/i.test(here)) {
      return '来「轻聊」和我聊天：\n' + here + '\n房间口令：' + S.room + '\n（打开后填个昵称就能进）';
    }
    return '来「轻聊」和我聊天：\n打开我发给你的 qingliao-chat.html\n房间口令：' + S.room + '\n（填个昵称就能进）';
  }

  /* ------------------------------------------------------------------ */
  /* 输入框                                                              */
  /* ------------------------------------------------------------------ */

  function autoGrow() {
    var el = $('msgInput');
    var atBottom = nearBottom();
    el.style.height = 'auto';
    el.style.height = Math.min(132, el.scrollHeight) + 'px';
    if (atBottom) scrollDown(true);     // 输入框变高时，别把最新消息挤出视野
  }

  function updateCounter() {
    var n = $('msgInput').value.length;
    var el = $('counter');
    if (n >= 650) {
      el.textContent = n + ' / ' + MAX_LEN;
      el.classList.remove('is-hidden');
    } else {
      el.classList.add('is-hidden');
    }
  }

  /* ------------------------------------------------------------------ */
  /* 表情面板                                                           */
  /* ------------------------------------------------------------------ */

  var EMOJIS = ('😀 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 😉 😍 🥰 😘 😋 😜 🤪 🤗 🤔 🤨 😐 😑 😴 🥱 😮 😲 😳 🥺 😢 😭 😤 😡 ' +
    '🤯 😱 😬 🙄 😏 😒 😞 😔 👍 👎 👌 ✌️ 🤞 👏 🙌 🙏 💪 👋 🤝 👀 ❤️ 🧡 💛 💚 💙 💜 💔 💯 🔥 ✨ 🎉 🎊 ✅ ❌ ⚠️ ⏰ 💻 📌 ☕ 🍜').split(' ');

  function buildEmojiPanel() {
    var panel = $('emojiPanel');
    if (!panel || panel.childNodes.length) return;
    for (var i = 0; i < EMOJIS.length; i++) {
      (function (ch) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'emoji';
        b.textContent = ch;
        b.addEventListener('click', function (ev) {
          ev.stopPropagation();
          insertAtCursor(ch);
        });
        panel.appendChild(b);
      })(EMOJIS[i]);
    }
  }

  function insertAtCursor(text) {
    var el = $('msgInput');
    var start = el.selectionStart;
    var end = el.selectionEnd;
    var v = el.value || '';
    if (typeof start !== 'number' || typeof end !== 'number') { start = v.length; end = v.length; }
    el.value = v.slice(0, start) + text + v.slice(end);
    var pos = start + text.length;
    try { el.setSelectionRange(pos, pos); } catch (e) { /* ignore */ }
    el.focus();
    autoGrow();
    updateCounter();
    maybeSendTyping();
  }

  function toggleEmoji(force) {
    var panel = $('emojiPanel');
    if (!panel) return;
    var show = typeof force === 'boolean' ? force : panel.classList.contains('is-hidden');
    panel.classList.toggle('is-hidden', !show);
  }

  function submitInput() {
    var el = $('msgInput');
    var text = el.value;
    if (!text.replace(/\s+/g, '')) return;
    el.value = '';
    autoGrow();
    updateCounter();
    toggleEmoji(false);
    sendMessage(text);
  }

  /* ------------------------------------------------------------------ */
  /* 启动                                                               */
  /* ------------------------------------------------------------------ */

  function boot() {
    if (!$('joinScreen')) return;   // 非正式页面（例如测试页）不启动界面

    var q = new URLSearchParams(location.search);
    var savedNick = '';
    var savedRoom = '';
    try {
      savedNick = localStorage.getItem('ql.nick') || '';
      savedRoom = localStorage.getItem('ql.room') || '';
    } catch (e) { /* ignore */ }

    $('nickInput').value = q.get('nick') || savedNick;
    $('roomInput').value = q.get('room') || savedRoom || randCode();
    if (savedRoom && $('rememberChk')) $('rememberChk').checked = true;

    $('rollBtn').addEventListener('click', function () {
      $('roomInput').value = randCode();
      $('roomInput').focus();
    });

    $('joinForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      enter();
    });

    $('sendBtn').addEventListener('click', submitInput);

    buildEmojiPanel();
    $('emojiBtn').addEventListener('click', function (ev) {
      ev.stopPropagation();
      toggleEmoji();
    });
    $('emojiPanel').addEventListener('click', function (ev) { ev.stopPropagation(); });

    $('imgBtn').addEventListener('click', function () {
      $('fileInput').click();
    });
    $('fileInput').addEventListener('change', function () {
      var files = this.files ? Array.prototype.slice.call(this.files) : [];
      this.value = '';
      for (var i = 0; i < files.length; i++) sendImage(files[i]);
    });
    document.addEventListener('paste', function (ev) {
      if (!S.entered) return;
      var cd = ev.clipboardData;
      if (!cd || !cd.items) return;
      for (var i = 0; i < cd.items.length; i++) {
        var it = cd.items[i];
        if (it.kind === 'file' && /^image\//.test(it.type || '')) {
          var f = it.getAsFile();
          if (f) { ev.preventDefault(); sendImage(f); return; }
        }
      }
    });

    $('jumpBtn').addEventListener('click', function () {
      resetJump();
      scrollDown(true);
    });
    $('log').addEventListener('scroll', function () {
      if (S.pending && nearBottom()) resetJump();
    });

    $('msgInput').addEventListener('input', function () {
      autoGrow();
      updateCounter();
      if ($('msgInput').value.replace(/\s+/g, '')) maybeSendTyping();
    });
    $('msgInput').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.keyCode !== 229) {
        ev.preventDefault();
        submitInput();
      }
    });

    $('inviteBtn').addEventListener('click', function () {
      copyText(inviteText()).then(function (ok) {
        toast(ok ? '邀请信息已复制，粘贴给对方即可' : '复制失败，请手动记下房间口令：' + S.room);
      });
    });

    $('modeBtn').addEventListener('click', function () {
      S.mode = S.mode === 'sse' ? 'poll' : 'sse';
      $('modeBtn').textContent = S.mode === 'sse' ? '实时' : '兼容';
      $('modeBtn').title = S.mode === 'sse' ? '当前为实时推送，点击可切换兼容模式' : '当前为每 3 秒拉取，点击可切回实时推送';
      toast(S.mode === 'sse' ? '已切换为实时推送' : '已切换为兼容模式（网络受限时更稳）');
      if (S.entered) connect();
    });

    $('leaveBtn').addEventListener('click', function () {
      if (S.entered && !window.confirm('退出当前房间？')) return;
      leave();
    });

    /* ---------- 更多菜单 ---------- */
    function hideMenu() {
      $('menu').classList.add('is-hidden');
      $('moreBtn').setAttribute('aria-expanded', 'false');
    }
    function setSwitch(el, on) { el.setAttribute('aria-checked', on ? 'true' : 'false'); }

    setSwitch($('notifyItem'), P.notify);
    setSwitch($('soundItem'), P.sound);

    $('moreBtn').addEventListener('click', function (ev) {
      ev.stopPropagation();
      var open = $('menu').classList.contains('is-hidden');
      $('menu').classList.toggle('is-hidden', !open);
      $('moreBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    $('menu').addEventListener('click', function (ev) { ev.stopPropagation(); });

    $('notifyItem').addEventListener('click', function () {
      if (P.notify) {
        P.notify = false;
        setSwitch($('notifyItem'), false);
        savePref();
        toast('已关闭消息提醒');
        return;
      }
      if (!('Notification' in window)) { toast('这个浏览器不支持桌面通知'); return; }
      if (Notification.permission === 'granted') {
        P.notify = true;
        setSwitch($('notifyItem'), true);
        savePref();
        toast('已开启：页面在后台时提醒');
        return;
      }
      if (Notification.permission === 'denied') { toast('通知被浏览器拒绝了，请到浏览器设置里允许'); return; }
      Notification.requestPermission().then(function (perm) {
        if (perm === 'granted') {
          P.notify = true;
          setSwitch($('notifyItem'), true);
          savePref();
          toast('已开启：页面在后台时提醒');
        } else {
          toast('没有拿到通知权限');
        }
      });
    });

    $('soundItem').addEventListener('click', function () {
      P.sound = !P.sound;
      setSwitch($('soundItem'), P.sound);
      savePref();
      if (P.sound) { ensureAudio(); beep(); }
      toast(P.sound ? '已开启提示音' : '已关闭提示音');
    });

    $('miniItem').addEventListener('click', function () {
      hideMenu();
      toggleMini();
    });
    $('miniItem').setAttribute('aria-checked', (pipWin && !pipWin.closed) ? 'true' : 'false');

    if ($('menuNote')) $('menuNote').textContent = '版本 ' + VERSION + ' · 已读/输入已启用';

    $('renameItem').addEventListener('click', function () {
      hideMenu();
      openRename();
    });
    $('renameCancel').addEventListener('click', closeRename);
    $('renameOk').addEventListener('click', saveRename);
    $('renameInput').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); saveRename(); }
    });
    $('renameModal').addEventListener('click', function (ev) {
      if (ev.target === $('renameModal')) closeRename();
    });

    $('clearBtn').addEventListener('click', function () {
      if (!window.confirm('清空这台电脑上保存的聊天记录？\n（对方那边不受影响，清空后无法恢复）')) return;
      clearHist();
      hideMenu();
      toast('本机聊天记录已清空');
    });

    $('qbClose').addEventListener('click', function () {
      clearQuote();
      $('msgInput').focus();
    });

    document.addEventListener('click', function (ev) {
      if (!$('menu').classList.contains('is-hidden') &&
          !$('menu').contains(ev.target) && ev.target !== $('moreBtn')) {
        hideMenu();
      }
      toggleEmoji(false);
      var openMsg = $('log').querySelector('.msg.show-tools');
      if (openMsg && !openMsg.contains(ev.target)) openMsg.classList.remove('show-tools');
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        hideMenu();
        closeRename();
        toggleEmoji(false);
        if (S.quote) clearQuote();
      }
    });

    /* ---------- 断线看门狗 & 网络恢复 ---------- */
    window.addEventListener('online', function () {
      if (S.entered && !S.connected) connect();
    });
    window.addEventListener('offline', function () {
      if (S.entered) setStatus('offline', '网络已断开');
    });

    /* ---------- 手机键盘弹起时保持输入框可见 ---------- */
    if (window.visualViewport) {
      var vv = window.visualViewport;
      var syncViewport = function () {
        var chat = $('chatScreen');
        if (!chat) return;
        if (S.entered && window.innerWidth <= 700) {
          chat.style.height = Math.max(280, Math.round(vv.height)) + 'px';
          scrollDown();
        } else {
          chat.style.height = '';
        }
      };
      vv.addEventListener('resize', syncViewport);
      vv.addEventListener('scroll', syncViewport);
    }

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) clearUnread();
      if (!document.hidden) updateTitle();
      if (!document.hidden) markVisibleRead();
    });
    window.addEventListener('focus', function () {
      clearUnread();
      markVisibleRead();
    });

    // 邀请链接里带口令：?room=xxx&nick=yyy&go=1
    if (q.get('go') === '1' && q.get('room') && q.get('nick')) {
      enter();
    } else if (q.get('room')) {
      $('nickInput').focus();
    }

    if (S.mode === 'sse') $('modeBtn').textContent = '实时';

    // 窄屏用短提示，避免 placeholder 换行被裁掉
    var fitPlaceholder = function () {
      if (!$('msgInput')) return;
      $('msgInput').placeholder = window.innerWidth < 620
        ? '输入消息…'
        : '输入消息，Enter 发送，Shift + Enter 换行';
    };
    fitPlaceholder();
    window.addEventListener('resize', fitPlaceholder);
  }

  // 调试/自测入口（正常使用不受影响）
  window.__ql = {
    version: VERSION,
    topicFor: topicFor,
    seal: seal,
    unseal: unseal,
    makeKey: makeKey,
    hasCrypto: function () { return HAS_CRYPTO; },
    state: S,
    prefs: P,
    send: sendMessage,
    feed: handleRaw,
    quote: startQuote,
    enter: enter
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      try { boot(); } catch (e) {
        document.body.innerHTML = '<pre style="padding:20px;color:#b91c1c">页面启动失败：' + String(e && e.message || e) + '</pre>';
      }
    });
  } else {
    try { boot(); } catch (e) {
      document.body.innerHTML = '<pre style="padding:20px;color:#b91c1c">页面启动失败：' + String(e && e.message || e) + '</pre>';
    }
  }
})();
</script>
</body>
</html>
