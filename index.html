<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>轻聊 · 极简网页聊天</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b5bd6'/%3E%3Cpath d='M18 22h28v16H30l-8 7v-7h-4z' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f5fb; --card:#ffffff; --ink:#1f2233; --muted:#8b90a6; --line:#e9eaf3;
    --accent:#5b5bd6; --accent2:#7c3aed; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);-webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 620px at 8% -12%, #e4e7ff 0%, rgba(228,231,255,0) 62%),
      radial-gradient(900px 560px at 96% -6%, #ffe6f4 0%, rgba(255,230,244,0) 58%),
      var(--bg);
  }
  .app{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}
  .is-hidden{display:none!important}

  /* ---------- 进入房间 ---------- */
  .card{
    width:min(430px,100%);background:var(--card);border-radius:26px;padding:30px 26px 22px;
    box-shadow:0 24px 60px rgba(31,34,51,.12), 0 2px 6px rgba(31,34,51,.05);
    border:1px solid rgba(255,255,255,.8);
  }
  .logo{
    width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:26px;background:linear-gradient(135deg,#5b5bd6,#7c3aed);
    box-shadow:0 10px 22px rgba(91,91,214,.28);margin-bottom:14px;
  }
  .card h1{margin:0 0 6px;font-size:23px;letter-spacing:.5px}
  .lead{margin:0 0 20px;color:var(--muted);font-size:13.5px;line-height:1.65}
  .field{display:block;margin-bottom:14px}
  .field>span{display:block;font-size:12.5px;color:#6b7089;margin:0 2px 6px;font-weight:600}
  input[type=text]{
    width:100%;height:46px;border:1px solid var(--line);background:#f8f8fd;border-radius:13px;
    padding:0 14px;font:inherit;font-size:16px;color:var(--ink);outline:none;transition:.15s;
  }
  input[type=text]:focus{background:#fff;border-color:#c7c7f5;box-shadow:0 0 0 4px rgba(91,91,214,.10)}
  .check{display:flex;align-items:center;gap:7px;margin:-2px 2px 14px;font-size:12.5px;color:#6b7089;cursor:pointer;user-select:none}
  .check input{width:15px;height:15px;accent-color:#5b5bd6;margin:0;cursor:pointer;flex:none}
  .row{display:flex;gap:8px}
  .row input{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3px}
  button{font:inherit;cursor:pointer;border:0;transition:.15s;border-radius:13px}
  .primary{
    width:100%;height:48px;margin-top:6px;font-size:15.5px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,#5b5bd6,#7c3aed);box-shadow:0 12px 24px rgba(91,91,214,.26);
  }
  .primary:active{transform:translateY(1px)}
  .primary[disabled]{opacity:.6;box-shadow:none;cursor:default}
  .ghost{background:transparent;color:#5b6076;padding:7px 10px;font-size:13px;border-radius:10px;white-space:nowrap}
  .ghost:hover{background:#f1f1fa;color:var(--ink)}
  .hint{margin:14px 2px 0;font-size:12px;line-height:1.6;color:var(--muted)}
  .err{margin:10px 2px 0;font-size:12.5px;color:var(--bad)}

  /* ---------- 聊天 ---------- */
  .chat{
    width:min(880px,100%);height:min(calc(100dvh - 36px),920px);position:relative;
    background:var(--card);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 24px 60px rgba(31,34,51,.13), 0 2px 6px rgba(31,34,51,.05);
    border:1px solid rgba(255,255,255,.8);
  }
  .topbar{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fff,rgba(255,255,255,.92));backdrop-filter:blur(6px);
  }
  .who{min-width:0;flex:1}
  .room{display:flex;align-items:center;gap:6px;font-weight:650;font-size:15px}
  .room .lock{font-size:12px;opacity:.75}
  .room em{font-style:normal;color:var(--muted);font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;flex:none}
  .dot.online{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.16)}
  .dot.offline{background:var(--bad);box-shadow:0 0 0 3px rgba(239,68,68,.13)}
  .dot.connecting{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .actions{display:flex;gap:2px;flex:none}
  #moreBtn{font-size:16px;line-height:1;letter-spacing:1px;padding:5px 9px}

  .log{
    flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 6px;
    display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;
    background:linear-gradient(180deg,#fcfcff, #fff 40%);
  }
  .empty{margin:auto;text-align:center;color:var(--muted);padding:24px}
  .emptyIcon{font-size:34px;margin-bottom:8px}
  .empty p{margin:4px 0;font-size:14px}
  .empty .small{font-size:12px;opacity:.8}

  .msg{display:flex;flex-direction:column;max-width:min(78%,560px);margin:3px 0;animation:pop .18s ease-out}
  .msg.own{align-self:flex-end;align-items:flex-end}
  .msg.other{align-self:flex-start;align-items:flex-start}
  .name{font-size:12px;color:#767c93;margin:0 5px 3px}
  .bubble{
    padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  }
  .msg.own .bubble{background:linear-gradient(135deg,#5b5bd6,#7c3aed);color:#fff;border-bottom-right-radius:6px;box-shadow:0 8px 18px rgba(91,91,214,.24)}
  .msg.other .bubble{background:#f6f6fc;border:1px solid #ececf6;border-bottom-left-radius:6px}
  .meta{font-size:10.5px;line-height:1.3;color:#b0b4c6;margin:0;white-space:nowrap}
  .msg.failed .meta{color:var(--bad)}
  .msg.failed .bubble{opacity:.55}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* 消息上的小工具（引用 / 复制） */
  .msg{position:relative}
  .foot{display:flex;align-items:center;gap:8px;margin:2px 6px 3px;min-height:18px}
  .msg.own .foot{flex-direction:row-reverse}
  .tools{display:none;gap:6px}
  .msg.show-tools .tools{display:flex}
  @media (hover:hover){ .msg:hover .tools{display:flex} }
  .tool{background:#ececf8;color:#5b6076;font-size:11px;padding:1px 7px;border-radius:7px;line-height:1.5}
  .tool:hover{background:#dedef4;color:#3f3f6e}

  /* 引用块 */
  .quote{border-left:3px solid rgba(255,255,255,.55);padding:1px 0 2px 8px;margin:0 0 6px;font-size:12.5px;line-height:1.45;opacity:.9;cursor:pointer}
  .msg.other .quote{border-left-color:#c3c6e0}
  .quote .qn{font-weight:650;margin-right:4px}
  .msg.flash .bubble{outline:2px solid #b9b9f0;outline-offset:2px}

  .composer{
    display:flex;gap:10px;align-items:flex-end;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:#fff;position:relative;
  }
  .counter{
    position:absolute;right:16px;bottom:calc(100% + 6px);font-size:10.5px;color:#9aa0b6;
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px;
  }

  /* 引用条 */
  .quotebar{
    display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);
    background:#f7f7fc;
  }
  .quotebar .qb-main{flex:1;min-width:0;border-left:3px solid #b9b9f0;padding-left:9px}
  .qb-name{display:block;font-size:11.5px;font-weight:650;color:#6b7089}
  .qb-text{display:block;font-size:12.5px;color:#8b90a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qb-close{width:28px;height:28px;border-radius:9px;background:transparent;color:#8b90a6;font-size:17px;line-height:1;flex:none}
  .qb-close:hover{background:#ededf9;color:#3f3f6e}

  /* 更多菜单 */
  .menu{
    position:absolute;top:56px;right:12px;z-index:30;width:186px;padding:6px;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 16px 40px rgba(31,34,51,.16);
  }
  .menu-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    padding:9px 10px;border-radius:10px;background:transparent;color:var(--ink);font-size:13.5px;text-align:left;
  }
  .menu-item:hover{background:#f4f4fb}
  .menu-item.danger{color:#d14343}
  .switch{width:32px;height:18px;border-radius:999px;background:#dedee9;position:relative;flex:none;transition:.15s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.15s}
  .menu-item[aria-checked=true] .switch{background:var(--accent)}
  .menu-item[aria-checked=true] .switch::after{left:16px}
  #msgInput{
    flex:1;resize:none;max-height:132px;min-height:46px;border:1px solid var(--line);background:#f8f8fd;
    border-radius:16px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.45;color:var(--ink);
    outline:none;transition:.15s;
  }
  #msgInput:focus{background:#fff;border-color:#c7c7f5;box-shadow:0 0 0 4px rgba(91,91,214,.10)}
  #msgInput::placeholder{color:#b3b7c9}
  .send{width:auto;height:46px;margin:0;padding:0 20px;flex:none}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;max-width:86vw;
    background:rgba(31,34,51,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;
    box-shadow:0 10px 30px rgba(0,0,0,.22);text-align:center;animation:pop .16s ease-out;
  }
  .sys{align-self:center;font-size:12px;color:#9aa0b6;background:#f4f4fb;padding:5px 12px;border-radius:999px;margin:8px 0}

  @media (max-width:700px){
    .app{padding:0}
    .chat{height:100dvh;border-radius:0;border:0;box-shadow:none}
    .card{margin:16px}
    .log{padding:14px 12px 4px}
    .msg{max-width:86%}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  }

  /* ---------- 深色模式 ---------- */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1016; --card:#171a23; --ink:#e7e9f3; --muted:#8f96ab; --line:#272c3a;
    }
    body{
      background:
        radial-gradient(1000px 600px at 8% -12%, rgba(64,66,140,.45) 0%, rgba(64,66,140,0) 62%),
        radial-gradient(900px 560px at 96% -6%, rgba(120,40,90,.35) 0%, rgba(120,40,90,0) 58%),
        var(--bg);
    }
    .card,.chat{background:var(--card);border-color:#232837;box-shadow:0 24px 60px rgba(0,0,0,.45)}
    .topbar{background:linear-gradient(180deg,#171a23,rgba(23,26,35,.94));border-bottom-color:var(--line)}
    .log{background:linear-gradient(180deg,#141722,#171a23 40%)}
    .msg.other .bubble{background:#1e2230;border-color:#2a3042;color:var(--ink)}
    .name{color:#9aa1b6}
    .meta{color:#6d748a}
    .msg.own .bubble{box-shadow:0 8px 18px rgba(60,40,140,.45)}
    .field>span,.check{color:#a3a9bd}
    input[type=text]{background:#1b1f2b;border-color:#2a3042;color:var(--ink)}
    input[type=text]:focus{background:#202533;border-color:#4a4ac0}
    #msgInput{background:#1b1f2b;border-color:#2a3042;color:var(--ink)}
    #msgInput:focus{background:#202533;border-color:#4a4ac0}
    #msgInput::placeholder{color:#5f667c}
    .composer{background:var(--card);border-top-color:var(--line)}
    .counter{background:#1e2230;border-color:#2a3042;color:#8f96ab}
    .tool{background:#232838;color:#b9c0d4}
    .tool:hover{background:#2b3145;color:#fff}
    .sys{background:#1e2230;color:#8b93a8}
    .empty{color:var(--muted)}
    .menu{background:#1c2130;border-color:#2a3042;box-shadow:0 16px 40px rgba(0,0,0,.5)}
    .menu-item{color:var(--ink)}
    .menu-item:hover{background:#242a3a}
    .switch{background:#3a4054}
    .ghost{color:#aab1c6}
    .ghost:hover{background:#242a3a;color:#fff}
    .tool{background:#252b3b;color:#b9c0d4}
    .tool:hover{background:#2f3648;color:#fff}
    .msg.other .quote{border-left-color:#4a5270}
    .quotebar{background:#1a1f2c;border-top-color:var(--line)}
    .quotebar .qb-main{border-left-color:#5b5bd6}
    .qb-name{color:#a3a9bd}
    .qb-text{color:#7d8499}
    .qb-close{color:#8f96ab}
    .qb-close:hover{background:#242a3a;color:#fff}
    .toast{background:rgba(230,232,242,.96);color:#14161d}
    .msg.flash .bubble{outline-color:#7c7cf0}
  }
</style>
</head>
<body>
<div class="app">

  <!-- 进入房间 -->
  <section class="card" id="joinScreen">
    <div class="logo" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 11.6c0 4.6-4 8.3-9 8.3-.9 0-1.8-.1-2.6-.4L3.4 21l1.5-4.4A8 8 0 0 1 3 11.6c0-4.6 4-8.3 9-8.3s9 3.7 9 8.3Z" fill="#fff"/>
      </svg>
    </div>
    <h1>轻聊</h1>
    <p class="lead">不用注册、不用装软件。你和对方打开同一个网页、填同一个「房间口令」，就能实时收到对方的消息。</p>
    <form id="joinForm" autocomplete="off">
      <label class="field">
        <span>你的昵称</span>
        <input type="text" id="nickInput" maxlength="12" placeholder="例如：小王">
      </label>
      <label class="field">
        <span>房间口令</span>
        <div class="row">
          <input type="text" id="roomInput" maxlength="40" placeholder="两人必须相同" spellcheck="false">
          <button type="button" class="ghost" id="rollBtn">换一个</button>
        </div>
      </label>
      <label class="check"><input type="checkbox" id="rememberChk"><span>在这台电脑上记住房间口令</span></label>
      <button type="submit" class="primary" id="enterBtn">进入聊天</button>
    </form>
    <p class="err" id="joinErr" hidden></p>
    <p class="hint">口令就是房间钥匙，只有口令相同的人才会进同一个房间；把口令告诉对方即可。消息在浏览器里加密后再转发，中转服务器看不到内容；本机保存的聊天记录同样是密文。</p>
  </section>

  <!-- 聊天 -->
  <section class="chat is-hidden" id="chatScreen">
    <header class="topbar">
      <div class="who">
        <div class="room"><span class="lock" id="lockIcon">🔒</span><span>房间</span><em id="roomName"></em></div>
        <div class="stat"><i class="dot connecting" id="dot"></i><span id="statText">连接中…</span></div>
      </div>
      <div class="actions">
        <button type="button" class="ghost" id="inviteBtn" title="复制邀请信息发给对方">邀请</button>
        <button type="button" class="ghost" id="modeBtn" title="网络不通时可切换连接方式">实时</button>
        <button type="button" class="ghost" id="moreBtn" title="更多选项" aria-haspopup="menu" aria-expanded="false">⋯</button>
        <button type="button" class="ghost" id="leaveBtn" title="回到进入页">退出</button>
      </div>
    </header>

    <div class="menu is-hidden" id="menu" role="menu">
      <button type="button" class="menu-item" id="notifyItem" role="menuitemcheckbox" aria-checked="false">
        <span>消息提醒</span><i class="switch"></i>
      </button>
      <button type="button" class="menu-item" id="soundItem" role="menuitemcheckbox" aria-checked="false">
        <span>提示音</span><i class="switch"></i>
      </button>
      <button type="button" class="menu-item danger" id="clearBtn" role="menuitem">清空本机记录</button>
    </div>

    <main class="log" id="log">
      <div class="empty" id="emptyState">
        <div class="emptyIcon">👋</div>
        <p>还没有消息，打个招呼吧</p>
        <p class="small">把房间口令告诉对方，TA 在同一个网页输入后就能收到</p>
      </div>
    </main>

    <div class="quotebar is-hidden" id="quoteBar">
      <div class="qb-main">
        <span class="qb-name" id="qbName"></span>
        <span class="qb-text" id="qbText"></span>
      </div>
      <button type="button" class="qb-close" id="qbClose" aria-label="取消引用">×</button>
    </div>

    <footer class="composer">
      <span class="counter is-hidden" id="counter"></span>
      <textarea id="msgInput" rows="1" maxlength="800" enterkeyhint="send" autocapitalize="off" placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
      <button type="button" class="primary send" id="sendBtn">发送</button>
    </footer>
  </section>
</div>

<div class="toast is-hidden" id="toast"></div>
<noscript><p style="text-align:center;padding:20px">这个网页需要浏览器启用 JavaScript 才能使用。</p></noscript>

<script>
(function () {
  'use strict';

  var VERSION = '1.0.0';
  var BASE = 'https://ntfy.sh';        // 消息中转（无需注册的公共服务）
  var MAX_LEN = 800;
  var HIST_MAX = 300;

  var $ = function (id) { return document.getElementById(id); };

  /* ------------------------------------------------------------------ */
  /* 基础工具                                                           */
  /* ------------------------------------------------------------------ */

  // cyrb53：把房间口令稳定地映射成一个短串，作为中转服务上的主题名
  function cyrb53(str, seed) {
    var h1 = 0xdeadbeef ^ (seed || 0);
    var h2 = 0x41c6ce57 ^ (seed || 0);
    for (var i = 0; i < str.length; i++) {
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }

  function topicFor(room) {
    return 'ql-' + Math.floor(cyrb53('qingliao|v1|' + String(room).trim().toLowerCase())).toString(36);
  }

  function randCode() {
    var a = ['blue', 'green', 'happy', 'quiet', 'sunny', 'lucky', 'silver', 'warm', 'bright', 'fresh'];
    var b = ['tiger', 'panda', 'river', 'cloud', 'moon', 'star', 'leaf', 'bird', 'rock', 'wind'];
    var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
    return pick(a) + '-' + pick(b) + '-' + Math.floor(1000 + Math.random() * 9000);
  }

  function uid() {
    try {
      if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    } catch (e) { /* ignore */ }
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function fmtTime(ts) {
    var d = new Date(ts || Date.now());
    var now = new Date();
    var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    var sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    return sameDay ? hm : (pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + hm);
  }

  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.remove('is-hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.add('is-hidden'); }, 2600);
  }

  /* ------------------------------------------------------------------ */
  /* 端到端加密（WebCrypto 不可用时自动降级为明文）                        */
  /* ------------------------------------------------------------------ */

  var HAS_CRYPTO = !!(window.crypto && window.crypto.subtle && window.TextEncoder);
  var TE = window.TextEncoder ? new TextEncoder() : null;
  var TD = window.TextDecoder ? new TextDecoder() : null;

  function toB64(bytes) {
    var out = '';
    var CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) {
      out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(out);
  }

  function fromB64(str) {
    var raw = atob(str);
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }

  function makeKey(room) {
    return window.crypto.subtle
      .importKey('raw', TE.encode('qingliao|' + String(room).trim().toLowerCase()), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: TE.encode('qingliao-salt-v1'), iterations: 120000, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      });
  }

  // 本地聊天记录用另一把由同一口令派生的密钥加密
  function makeHistKey(room) {
    return window.crypto.subtle
      .importKey('raw', TE.encode('qingliao-hist|' + String(room).trim().toLowerCase()), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: TE.encode('qingliao-hist-salt-v1'), iterations: 120000, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      });
  }

  function seal(key, obj) {
    var json = JSON.stringify(obj);
    if (!key) return Promise.resolve('p:' + toB64(TE.encode(json)));
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    return window.crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, TE.encode(json)).then(function (ct) {
      return 'e:' + toB64(iv) + '.' + toB64(new Uint8Array(ct));
    });
  }

  function unseal(key, payload) {
    if (typeof payload !== 'string' || payload.length < 3) return Promise.reject(new Error('bad payload'));
    if (payload.slice(0, 2) === 'p:') {
      return Promise.resolve(JSON.parse(TD.decode(fromB64(payload.slice(2)))));
    }
    if (payload.slice(0, 2) !== 'e:') return Promise.reject(new Error('unknown format'));
    if (!key) return Promise.reject(new Error('no key'));
    var rest = payload.slice(2);
    var dot = rest.indexOf('.');
    if (dot < 0) return Promise.reject(new Error('bad envelope'));
    var iv = fromB64(rest.slice(0, dot));
    var ct = fromB64(rest.slice(dot + 1));
    return window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct).then(function (pt) {
      return JSON.parse(TD.decode(new Uint8Array(pt)));
    });
  }

  /* ------------------------------------------------------------------ */
  /* 运行时状态                                                          */
  /* ------------------------------------------------------------------ */

  var S = {
    nick: '', room: '', topic: '', key: null, histKey: null,
    es: null, pollTimer: null, reconnectTimer: null,
    mode: 'sse',                 // sse | poll
    cursor: '',                  // 最后一条消息 id
    startedAt: 0,
    catchupSince: 0,             // 进房时补收的起点（秒）
    lastBeat: 0,                 // 最近一次收到服务端数据的时间
    quote: null,                 // 正在引用的消息
    audio: null,
    seen: Object.create(null),
    hist: [],
    saveSeq: 0,
    retry: 0,
    connected: false,
    lastSender: '',
    lastTs: 0,
    entered: false
  };

  // 本地偏好：消息提醒 / 提示音
  var P = { notify: false, sound: false };
  try {
    var savedPref = JSON.parse(localStorage.getItem('ql.pref') || '{}');
    if (savedPref && typeof savedPref === 'object') {
      P.notify = !!savedPref.notify;
      P.sound = !!savedPref.sound;
    }
  } catch (e) { /* ignore */ }

  function savePref() {
    try { localStorage.setItem('ql.pref', JSON.stringify(P)); } catch (e) { /* ignore */ }
  }

  function ensureAudio() {
    try {
      if (S.audio) return S.audio;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      S.audio = new AC();
      return S.audio;
    } catch (e) { return null; }
  }

  function beep() {
    try {
      var ctx = ensureAudio();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.05, ctx.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + 0.22);
    } catch (e) { /* ignore */ }
  }

  // 页面在后台时才打扰：可选提示音 + 系统通知
  function notifyMessage(msg) {
    if (!document.hidden) return;
    if (P.sound) beep();
    if (!P.notify) return;
    try {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      var n = new Notification(String(msg.n || '对方') + ' · 轻聊', {
        body: String(msg.t).slice(0, 120),
        tag: msg.id,
        silent: true
      });
      n.onclick = function () {
        try { window.focus(); } catch (e) { /* ignore */ }
        n.close();
      };
    } catch (e) { /* ignore */ }
  }

  function setStatus(kind, text) {
    var dot = $('dot');
    dot.className = 'dot ' + kind;
    $('statText').textContent = text;
    S.connected = kind === 'online';
  }

  /* ------------------------------------------------------------------ */
  /* 记录（本地加密保存，刷新不丢）                                       */
  /* ------------------------------------------------------------------ */

  function histKeyName() { return 'ql.hist.' + S.topic; }

  function saveHist() {
    var seq = ++S.saveSeq;
    var data = S.hist.slice();

    if (!S.histKey) {                       // 不支持加密时退化为明文
      try { localStorage.setItem(histKeyName(), JSON.stringify(data)); } catch (e) { /* ignore */ }
      return Promise.resolve();
    }

    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    return window.crypto.subtle
      .encrypt({ name: 'AES-GCM', iv: iv }, S.histKey, TE.encode(JSON.stringify(data)))
      .then(function (ct) {
        if (seq !== S.saveSeq) return;      // 有更新的快照，丢弃这次
        try {
          localStorage.setItem(histKeyName(), JSON.stringify({
            v: 1,
            iv: toB64(iv),
            ct: toB64(new Uint8Array(ct))
          }));
        } catch (e) { /* 配额满等情况忽略 */ }
      })
      .catch(function () { /* ignore */ });
  }

  function loadHist() {
    S.hist = [];
    var raw = null;
    try { raw = localStorage.getItem(histKeyName()); } catch (e) { raw = null; }
    if (!raw) return Promise.resolve();

    var parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }

    // 旧版本存的是明文数组：直接读出来，并顺便升级成密文
    if (Object.prototype.toString.call(parsed) === '[object Array]') {
      S.hist = parsed.slice(-HIST_MAX);
      saveHist();
      return Promise.resolve();
    }

    if (!parsed || typeof parsed !== 'object' || !parsed.iv || !parsed.ct || !S.histKey) {
      return Promise.resolve();
    }

    return window.crypto.subtle
      .decrypt({ name: 'AES-GCM', iv: fromB64(parsed.iv) }, S.histKey, fromB64(parsed.ct))
      .then(function (pt) {
        var arr = JSON.parse(TD.decode(new Uint8Array(pt)));
        if (Object.prototype.toString.call(arr) === '[object Array]') S.hist = arr.slice(-HIST_MAX);
      })
      .catch(function () { S.hist = []; });
  }

  function pushHist(msg) {
    S.hist.push(msg);
    if (S.hist.length > HIST_MAX) S.hist.splice(0, S.hist.length - HIST_MAX);
    saveHist();
  }

  function clearHist() {
    S.saveSeq++;                            // 作废进行中的写入
    try {
      localStorage.removeItem(histKeyName());
      localStorage.setItem('ql.clear.' + S.topic, String(Date.now()));   // 补收时不把清掉的捞回来
    } catch (e) { /* ignore */ }
    S.hist = [];
    S.lastSender = '';
    S.lastTs = 0;
    var logEl = $('log');
    var emptyEl = $('emptyState');
    while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
    emptyEl.classList.remove('is-hidden');
    logEl.appendChild(emptyEl);
  }

  /* ------------------------------------------------------------------ */
  /* 界面：消息渲染                                                       */
  /* ------------------------------------------------------------------ */

  function nearBottom() {
    var el = $('log');
    return el.scrollHeight - el.scrollTop - el.clientHeight < 90;
  }

  function scrollDown() {
    var el = $('log');
    requestAnimationFrame(function () { el.scrollTop = el.scrollHeight; });
  }

  function addSystem(text) {
    var el = document.createElement('div');
    el.className = 'sys';
    el.textContent = text;
    $('log').appendChild(el);
    scrollDown();
  }

  function renderMessage(msg, own, animate) {
    var empty = $('emptyState');
    if (empty) empty.classList.add('is-hidden');

    var wrap = document.createElement('div');
    wrap.className = 'msg ' + (own ? 'own' : 'other');
    if (animate === false) wrap.style.animation = 'none';
    if (msg.id) wrap.setAttribute('data-id', msg.id);

    var gap = msg.ts && S.lastTs ? (msg.ts - S.lastTs) : 0;
    var showName = !own && (S.lastSender !== msg.n || gap > 5 * 60 * 1000);

    if (showName) {
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = msg.n || '对方';
      wrap.appendChild(name);
    }

    var bubble = document.createElement('div');
    bubble.className = 'bubble';

    // 引用块
    if (msg.q && msg.q.id) {
      var quoted = document.createElement('div');
      quoted.className = 'quote';
      quoted.title = '点击跳转到原消息';
      var qn = document.createElement('span');
      qn.className = 'qn';
      qn.textContent = (msg.q.n || '对方') + '：';
      var qt = document.createElement('span');
      qt.className = 'qt';
      qt.textContent = String(msg.q.t || '').slice(0, 60);
      quoted.appendChild(qn);
      quoted.appendChild(qt);
      quoted.addEventListener('click', function (ev) {
        ev.stopPropagation();
        jumpTo(msg.q.id);
      });
      bubble.appendChild(quoted);
    }

    bubble.appendChild(document.createTextNode(msg.t));   // 纯文本，天然防注入
    wrap.appendChild(bubble);

    var meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = fmtTime(msg.ts);

    var foot = document.createElement('div');
    foot.className = 'foot';
    foot.appendChild(meta);

    // 引用 / 复制
    var tools = document.createElement('div');
    tools.className = 'tools';
    var btnQuote = document.createElement('button');
    btnQuote.type = 'button';
    btnQuote.className = 'tool';
    btnQuote.textContent = '引用';
    btnQuote.addEventListener('click', function (ev) {
      ev.stopPropagation();
      startQuote(msg);
      wrap.classList.remove('show-tools');
    });
    var btnCopy = document.createElement('button');
    btnCopy.type = 'button';
    btnCopy.className = 'tool';
    btnCopy.textContent = '复制';
    btnCopy.addEventListener('click', function (ev) {
      ev.stopPropagation();
      copyText(msg.t).then(function (ok) {
        toast(ok ? '已复制这条消息' : '复制失败，请手动选中');
      });
      wrap.classList.remove('show-tools');
    });
    tools.appendChild(btnQuote);
    tools.appendChild(btnCopy);
    foot.appendChild(tools);
    wrap.appendChild(foot);

    bubble.addEventListener('click', function (ev) {
      if (wrap.classList.contains('failed')) return;   // 失败消息的点击交给外层重发
      ev.stopPropagation();
      var open = $('log').querySelector('.msg.show-tools');
      if (open && open !== wrap) open.classList.remove('show-tools');
      wrap.classList.toggle('show-tools');
    });

    $('log').appendChild(wrap);

    S.lastSender = own ? '' : (msg.n || '对方');
    S.lastTs = msg.ts || Date.now();
  }

  /* ------------------------------------------------------------------ */
  /* 引用 / 跳转                                                         */
  /* ------------------------------------------------------------------ */

  function startQuote(msg) {
    if (!msg || !msg.id) return;
    S.quote = { id: msg.id, n: String(msg.n || '对方').slice(0, 24), t: String(msg.t).slice(0, 80) };
    $('qbName').textContent = (msg.n || '对方') + '：';
    $('qbText').textContent = String(msg.t).slice(0, 80);
    $('quoteBar').classList.remove('is-hidden');
    $('msgInput').focus();
  }

  function clearQuote() {
    S.quote = null;
    $('quoteBar').classList.add('is-hidden');
  }

  function jumpTo(id) {
    var el = $('log').querySelector('[data-id="' + id + '"]');
    if (!el) { toast('这条消息不在本机记录里'); return; }
    try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
    el.classList.add('flash');
    setTimeout(function () { el.classList.remove('flash'); }, 1200);
  }

  /* ------------------------------------------------------------------ */
  /* 网络：接收                                                          */
  /* ------------------------------------------------------------------ */

  function handleRaw(text) {
    var raw;
    try { raw = JSON.parse(text); } catch (e) { return; }
    if (!raw || raw.event !== 'message' || typeof raw.message !== 'string') return;
    if (raw.id && S.seen[raw.id]) return;
    if (raw.id) {
      S.seen[raw.id] = 1;
      S.cursor = raw.id;
    }

    return unseal(S.key, raw.message).then(function (env) {
      if (!env || typeof env.t !== 'string' || !env.t) return;
      if (env.id && S.seen[env.id]) return;
      if (env.id) S.seen[env.id] = 1;

      var msg = {
        id: env.id || raw.id || uid(),
        n: String(env.n || '对方').slice(0, 24),
        t: String(env.t).slice(0, MAX_LEN),
        ts: Number(env.ts) || (raw.time ? raw.time * 1000 : Date.now())
      };
      if (env.q && env.q.id) {
        msg.q = {
          id: String(env.q.id).slice(0, 64),
          n: String(env.q.n || '').slice(0, 24),
          t: String(env.q.t || '').slice(0, 80)
        };
      }
      var wasNear = nearBottom();
      renderMessage(msg, false, true);
      pushHist(msg);
      if (wasNear) scrollDown();
      notifyHidden();
      notifyMessage(msg);
    }).catch(function () {
      addSystem('收到一条无法解密的消息（对方的房间口令可能不一致）');
    });
  }

  function notifyHidden() {
    if (!document.hidden) return;
    document.title = '● 新消息 · 轻聊';
  }

  function teardown() {
    if (S.es) {
      try { S.es.close(); } catch (e) { /* ignore */ }
      S.es = null;
    }
    if (S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; }
    if (S.reconnectTimer) { clearTimeout(S.reconnectTimer); S.reconnectTimer = null; }
  }

  function scheduleReconnect() {
    if (!S.entered || S.reconnectTimer) return;
    var wait = Math.min(15000, 1200 * Math.pow(1.7, S.retry++));
    setStatus('offline', '已断开，' + Math.round(wait / 1000) + ' 秒后重连…');
    S.reconnectTimer = setTimeout(function () {
      S.reconnectTimer = null;
      connect();
    }, wait);
  }

  function connect() {
    if (!S.entered) return;
    teardown();
    var since = S.cursor || S.catchupSince || Math.floor(S.startedAt / 1000);

    if (S.mode === 'poll') {
      setStatus('connecting', '连接中…');
      pollOnce();
      S.pollTimer = setInterval(pollOnce, 2500);
      return;
    }

    setStatus('connecting', '连接中…');
    var url = BASE + '/' + encodeURIComponent(S.topic) + '/sse?since=' + encodeURIComponent(since);
    var es;
    try {
      es = new EventSource(url);
    } catch (e) {
      setStatus('offline', '无法连接');
      scheduleReconnect();
      return;
    }
    S.es = es;
    S.lastBeat = Date.now();

    es.onopen = function () {
      S.retry = 0;
      S.lastBeat = Date.now();
      setStatus('online', '已连接');
    };
    es.onmessage = function (ev) {
      S.lastBeat = Date.now();
      handleRaw(ev.data);
    };
    try {
      es.addEventListener('keepalive', function () { S.lastBeat = Date.now(); });
      es.addEventListener('open', function () { S.lastBeat = Date.now(); });
    } catch (e) { /* ignore */ }
    es.onerror = function () {
      if (es.readyState === 2) {          // CLOSED：浏览器已经放弃自动重连
        teardown();
        scheduleReconnect();
      } else {
        setStatus('offline', '已断开，正在重连…');
      }
    };
  }

  function pollOnce() {
    if (S.mode !== 'poll' || !S.entered) return;
    var since = S.cursor || Math.floor(S.startedAt / 1000);
    var url = BASE + '/' + encodeURIComponent(S.topic) + '/json?poll=1&since=' + encodeURIComponent(since);
    fetch(url, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (text) {
        setStatus('online', '已连接（兼容模式）');
        S.retry = 0;
        S.lastBeat = Date.now();
        var lines = text.split('\n');
        for (var i = 0; i < lines.length; i++) {
          if (lines[i].trim()) handleRaw(lines[i]);
        }
      })
      .catch(function () {
        setStatus('offline', '连接中断，正在重试…');
      });
  }

  // 长连接可能被代理悄悄掐断（浏览器不报错），这里做心跳看门狗
  setInterval(function () {
    if (!S.entered || S.mode !== 'sse' || !S.es || S.es.readyState !== 1) return;
    if (S.lastBeat && Date.now() - S.lastBeat > 95000) {
      setStatus('offline', '连接可能已失效，正在重连…');
      S.retry = 0;
      connect();
    }
  }, 15000);

  function publish(body) {
    var ctrl = null;
    var opts = {
      method: 'POST',
      body: body,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      cache: 'no-store'
    };
    try {
      ctrl = new AbortController();
      opts.signal = ctrl.signal;
      setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);
    } catch (e) { /* 老浏览器忽略超时 */ }

    return fetch(BASE + '/' + encodeURIComponent(S.topic), opts).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return true;
    });
  }

  /* ------------------------------------------------------------------ */
  /* 网络：发送                                                          */
  /* ------------------------------------------------------------------ */

  function sendMessage(text) {
    if (!S.entered) return Promise.resolve(false);
    text = String(text == null ? '' : text).replace(/^\s+|\s+$/g, '').slice(0, MAX_LEN);
    if (!text) return Promise.resolve(false);

    var env = { v: 1, id: uid(), n: S.nick, t: text, ts: Date.now() };
    if (S.quote && S.quote.id) env.q = { id: S.quote.id, n: S.quote.n, t: S.quote.t };
    S.seen[env.id] = 1;

    renderMessage(env, true, true);
    pushHist(env);
    clearQuote();

    return seal(S.key, env)
      .then(publish)
      .then(function () {
        if (S.mode === 'sse' && S.es && S.es.readyState === 1) setStatus('online', '已连接');
        return true;
      })
      .catch(function (err) {
        markFailed(env.id);
        var msg = String(err && err.message || err);
        if (msg.indexOf('429') >= 0) toast('发送太频繁了，等几秒再试');
        else if (msg.indexOf('413') >= 0) toast('消息太长，发短一点');
        else toast('发送失败，请检查网络后重试');
        return false;
      });
  }

  function markFailed(id) {
    var el = $('log').querySelector('[data-id="' + id + '"]');
    if (!el) return;
    el.classList.add('failed');
    var meta = el.querySelector('.meta');
    if (meta) meta.textContent = '未发送（点击重试）';
    el.style.cursor = 'pointer';
    el.addEventListener('click', function () { retry(id); }, { once: true });
  }

  function retry(id) {
    var msg = null;
    for (var i = 0; i < S.hist.length; i++) if (S.hist[i].id === id) msg = S.hist[i];
    if (!msg) return;
    var el = $('log').querySelector('[data-id="' + id + '"]');
    if (el) {
      el.classList.remove('failed');
      var meta = el.querySelector('.meta');
      if (meta) meta.textContent = fmtTime(msg.ts);
    }
    seal(S.key, msg).then(publish).then(function () {
      toast('已重新发送');
    }).catch(function () {
      markFailed(id);
      toast('还是发不出去，请检查网络');
    });
  }

  /* ------------------------------------------------------------------ */
  /* 进入 / 退出                                                         */
  /* ------------------------------------------------------------------ */

  function showJoinError(text) {
    var el = $('joinErr');
    if (!text) { el.hidden = true; return; }
    el.textContent = text;
    el.hidden = false;
  }

  function enter() {
    if (S.entered) return;
    var nick = $('nickInput').value.replace(/^\s+|\s+$/g, '').slice(0, 12);
    var room = $('roomInput').value.replace(/^\s+|\s+$/g, '');

    if (!nick) { showJoinError('请先填一个昵称'); $('nickInput').focus(); return; }
    if (room.length < 2) { showJoinError('房间口令至少 2 个字符'); $('roomInput').focus(); return; }

    showJoinError('');
    if (room.length < 8) {
      toast('口令偏短：建议至少 8 位，或点「换一个」用随机口令');
    }
    $('enterBtn').disabled = true;
    $('enterBtn').textContent = '正在进入…';

    S.nick = nick;
    S.room = room;
    S.topic = topicFor(room);
    S.startedAt = Date.now();
    S.cursor = '';
    S.seen = Object.create(null);
    S.entered = true;
    S.retry = 0;
    S.lastSender = '';
    S.lastTs = 0;
    S.lastBeat = 0;
    clearQuote();
    $('menu').classList.add('is-hidden');
    $('moreBtn').setAttribute('aria-expanded', 'false');
    $('chatScreen').style.height = '';

    try {
      localStorage.setItem('ql.nick', nick);
      if ($('rememberChk') && $('rememberChk').checked) localStorage.setItem('ql.room', room);
      else localStorage.removeItem('ql.room');
    } catch (e) { /* ignore */ }

    $('roomName').textContent = room;

    var ready = HAS_CRYPTO
      ? Promise.all([makeKey(room), makeHistKey(room)]).then(function (keys) {
          S.key = keys[0];
          S.histKey = keys[1];
        }).catch(function () { S.key = null; S.histKey = null; })
      : Promise.resolve();

    ready.then(function () {
      $('lockIcon').textContent = S.key ? '🔒' : '🔓';
      $('lockIcon').title = S.key ? '消息已端到端加密，本地记录也已加密' : '当前浏览器不支持加密，消息与本地记录均为明文';
      $('joinScreen').classList.add('is-hidden');
      $('chatScreen').classList.remove('is-hidden');
      $('enterBtn').disabled = false;
      $('enterBtn').textContent = '进入聊天';

      var logEl = $('log');
      var emptyEl = $('emptyState');
      while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
      emptyEl.classList.remove('is-hidden');
      logEl.appendChild(emptyEl);

      return loadHist();
    }).then(function () {
      for (var i = 0; i < S.hist.length; i++) renderMessage(S.hist[i], S.hist[i].n === S.nick, false);
      if (S.hist.length) {
        addSystem('以上是这台电脑上保存的历史消息');
        scrollDown();
      }

      // 补收离线期间的消息：从中转缓存里往回捞（最多 12 小时，清空过就从清空时间起算）
      var clearedAt = 0;
      try { clearedAt = Number(localStorage.getItem('ql.clear.' + S.topic)) || 0; } catch (e) { clearedAt = 0; }
      var lastTs = S.hist.length ? (S.hist[S.hist.length - 1].ts || 0) : 0;
      var floorTs = Math.max(Date.now() - 12 * 3600 * 1000, clearedAt, lastTs - 120000);
      S.catchupSince = Math.floor(Math.min(floorTs, Date.now()) / 1000);
      for (var j = 0; j < S.hist.length; j++) {
        if (S.hist[j].id) S.seen[S.hist[j].id] = 1;      // 已有的不重复渲染
      }

      if (!HAS_CRYPTO) toast('浏览器不支持加密，消息将以明文发送');
      connect();
      var touchOnly = false;
      try { touchOnly = window.matchMedia('(hover: none)').matches; } catch (e) { /* ignore */ }
      if (!touchOnly) setTimeout(function () { $('msgInput').focus(); }, 60);
    });
  }

  function leave() {
    S.entered = false;
    teardown();
    S.es = null;
    setStatus('offline', '已退出');
    clearQuote();
    $('menu').classList.add('is-hidden');
    $('moreBtn').setAttribute('aria-expanded', 'false');
    $('chatScreen').style.height = '';
    $('chatScreen').classList.add('is-hidden');
    $('joinScreen').classList.remove('is-hidden');
    document.title = '轻聊 · 极简网页聊天';
  }

  /* ------------------------------------------------------------------ */
  /* 复制 / 邀请                                                         */
  /* ------------------------------------------------------------------ */

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  function inviteText() {
    var here = location.href.split('#')[0].split('?')[0];
    if (/^https?:/i.test(here)) {
      return '来「轻聊」和我聊天：\n' + here + '\n房间口令：' + S.room + '\n（打开后填个昵称就能进）';
    }
    return '来「轻聊」和我聊天：\n打开我发给你的 qingliao-chat.html\n房间口令：' + S.room + '\n（填个昵称就能进）';
  }

  /* ------------------------------------------------------------------ */
  /* 输入框                                                              */
  /* ------------------------------------------------------------------ */

  function autoGrow() {
    var el = $('msgInput');
    el.style.height = 'auto';
    el.style.height = Math.min(132, el.scrollHeight) + 'px';
  }

  function updateCounter() {
    var n = $('msgInput').value.length;
    var el = $('counter');
    if (n >= 650) {
      el.textContent = n + ' / ' + MAX_LEN;
      el.classList.remove('is-hidden');
    } else {
      el.classList.add('is-hidden');
    }
  }

  function submitInput() {
    var el = $('msgInput');
    var text = el.value;
    if (!text.replace(/\s+/g, '')) return;
    el.value = '';
    autoGrow();
    updateCounter();
    sendMessage(text);
  }

  /* ------------------------------------------------------------------ */
  /* 启动                                                               */
  /* ------------------------------------------------------------------ */

  function boot() {
    if (!$('joinScreen')) return;   // 非正式页面（例如测试页）不启动界面

    var q = new URLSearchParams(location.search);
    var savedNick = '';
    var savedRoom = '';
    try {
      savedNick = localStorage.getItem('ql.nick') || '';
      savedRoom = localStorage.getItem('ql.room') || '';
    } catch (e) { /* ignore */ }

    $('nickInput').value = q.get('nick') || savedNick;
    $('roomInput').value = q.get('room') || savedRoom || randCode();
    if (savedRoom && $('rememberChk')) $('rememberChk').checked = true;

    $('rollBtn').addEventListener('click', function () {
      $('roomInput').value = randCode();
      $('roomInput').focus();
    });

    $('joinForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      enter();
    });

    $('sendBtn').addEventListener('click', submitInput);

    $('msgInput').addEventListener('input', function () {
      autoGrow();
      updateCounter();
    });
    $('msgInput').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.keyCode !== 229) {
        ev.preventDefault();
        submitInput();
      }
    });

    $('inviteBtn').addEventListener('click', function () {
      copyText(inviteText()).then(function (ok) {
        toast(ok ? '邀请信息已复制，粘贴给对方即可' : '复制失败，请手动记下房间口令：' + S.room);
      });
    });

    $('modeBtn').addEventListener('click', function () {
      S.mode = S.mode === 'sse' ? 'poll' : 'sse';
      $('modeBtn').textContent = S.mode === 'sse' ? '实时' : '兼容';
      $('modeBtn').title = S.mode === 'sse' ? '当前为实时推送，点击可切换兼容模式' : '当前为每 3 秒拉取，点击可切回实时推送';
      toast(S.mode === 'sse' ? '已切换为实时推送' : '已切换为兼容模式（网络受限时更稳）');
      if (S.entered) connect();
    });

    $('leaveBtn').addEventListener('click', function () {
      if (S.entered && !window.confirm('退出当前房间？')) return;
      leave();
    });

    /* ---------- 更多菜单 ---------- */
    function hideMenu() {
      $('menu').classList.add('is-hidden');
      $('moreBtn').setAttribute('aria-expanded', 'false');
    }
    function setSwitch(el, on) { el.setAttribute('aria-checked', on ? 'true' : 'false'); }

    setSwitch($('notifyItem'), P.notify);
    setSwitch($('soundItem'), P.sound);

    $('moreBtn').addEventListener('click', function (ev) {
      ev.stopPropagation();
      var open = $('menu').classList.contains('is-hidden');
      $('menu').classList.toggle('is-hidden', !open);
      $('moreBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    $('menu').addEventListener('click', function (ev) { ev.stopPropagation(); });

    $('notifyItem').addEventListener('click', function () {
      if (P.notify) {
        P.notify = false;
        setSwitch($('notifyItem'), false);
        savePref();
        toast('已关闭消息提醒');
        return;
      }
      if (!('Notification' in window)) { toast('这个浏览器不支持桌面通知'); return; }
      if (Notification.permission === 'granted') {
        P.notify = true;
        setSwitch($('notifyItem'), true);
        savePref();
        toast('已开启：页面在后台时提醒');
        return;
      }
      if (Notification.permission === 'denied') { toast('通知被浏览器拒绝了，请到浏览器设置里允许'); return; }
      Notification.requestPermission().then(function (perm) {
        if (perm === 'granted') {
          P.notify = true;
          setSwitch($('notifyItem'), true);
          savePref();
          toast('已开启：页面在后台时提醒');
        } else {
          toast('没有拿到通知权限');
        }
      });
    });

    $('soundItem').addEventListener('click', function () {
      P.sound = !P.sound;
      setSwitch($('soundItem'), P.sound);
      savePref();
      if (P.sound) { ensureAudio(); beep(); }
      toast(P.sound ? '已开启提示音' : '已关闭提示音');
    });

    $('clearBtn').addEventListener('click', function () {
      if (!window.confirm('清空这台电脑上保存的聊天记录？\n（对方那边不受影响，清空后无法恢复）')) return;
      clearHist();
      hideMenu();
      toast('本机聊天记录已清空');
    });

    $('qbClose').addEventListener('click', function () {
      clearQuote();
      $('msgInput').focus();
    });

    document.addEventListener('click', function (ev) {
      if (!$('menu').classList.contains('is-hidden') &&
          !$('menu').contains(ev.target) && ev.target !== $('moreBtn')) {
        hideMenu();
      }
      var openMsg = $('log').querySelector('.msg.show-tools');
      if (openMsg && !openMsg.contains(ev.target)) openMsg.classList.remove('show-tools');
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        hideMenu();
        if (S.quote) clearQuote();
      }
    });

    /* ---------- 断线看门狗 & 网络恢复 ---------- */
    window.addEventListener('online', function () {
      if (S.entered && !S.connected) connect();
    });
    window.addEventListener('offline', function () {
      if (S.entered) setStatus('offline', '网络已断开');
    });

    /* ---------- 手机键盘弹起时保持输入框可见 ---------- */
    if (window.visualViewport) {
      var vv = window.visualViewport;
      var syncViewport = function () {
        var chat = $('chatScreen');
        if (!chat) return;
        if (S.entered && window.innerWidth <= 700) {
          chat.style.height = Math.max(280, Math.round(vv.height)) + 'px';
          scrollDown();
        } else {
          chat.style.height = '';
        }
      };
      vv.addEventListener('resize', syncViewport);
      vv.addEventListener('scroll', syncViewport);
    }

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) document.title = '轻聊 · 极简网页聊天';
    });

    // 邀请链接里带口令：?room=xxx&nick=yyy&go=1
    if (q.get('go') === '1' && q.get('room') && q.get('nick')) {
      enter();
    } else if (q.get('room')) {
      $('nickInput').focus();
    }

    if (S.mode === 'sse') $('modeBtn').textContent = '实时';

    // 窄屏用短提示，避免 placeholder 换行被裁掉
    var fitPlaceholder = function () {
      if (!$('msgInput')) return;
      $('msgInput').placeholder = window.innerWidth < 620
        ? '输入消息…'
        : '输入消息，Enter 发送，Shift + Enter 换行';
    };
    fitPlaceholder();
    window.addEventListener('resize', fitPlaceholder);
  }

  // 调试/自测入口（正常使用不受影响）
  window.__ql = {
    version: VERSION,
    topicFor: topicFor,
    seal: seal,
    unseal: unseal,
    makeKey: makeKey,
    hasCrypto: function () { return HAS_CRYPTO; },
    state: S,
    prefs: P,
    send: sendMessage,
    feed: handleRaw,
    quote: startQuote,
    enter: enter
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      try { boot(); } catch (e) {
        document.body.innerHTML = '<pre style="padding:20px;color:#b91c1c">页面启动失败：' + String(e && e.message || e) + '</pre>';
      }
    });
  } else {
    try { boot(); } catch (e) {
      document.body.innerHTML = '<pre style="padding:20px;color:#b91c1c">页面启动失败：' + String(e && e.message || e) + '</pre>';
    }
  }
})();
</script>
</body>
</html>
