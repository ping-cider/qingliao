<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>QINGLIAO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307c160'/%3E%3Cpath d='M18 22h28v16H30l-8 7v-7h-4z' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#ededed; --card:#ffffff; --ink:#1a1a1a; --muted:#8a8a8a; --line:#d9d9d9;
    --accent:#07c160; --accent2:#06ad56; --ok:#07c160; --warn:#f0a020; --bad:#e64340;
    --bub-other:#ffffff; --bub-other-ink:#1a1a1a; --bub-own:#95ec69; --bub-own-ink:#1a1a1a;
    --chat-bg:#ededed; --bar-bg:#ededed; --input-bg:#f7f7f7;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);-webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
  }
  .app{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}
  .is-hidden{display:none!important}

  /* 进入房间 */
  .card{
    width:min(430px,100%);background:var(--card);border-radius:6px;padding:30px 26px 22px;
    box-shadow:0 8px 28px rgba(0,0,0,.12);
    border:1px solid #e2e2e2;
  }
  .logo{
    width:52px;height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:#07c160;margin-bottom:14px;
  }
  .card h1{margin:0 0 6px;font-size:23px;letter-spacing:.5px}
  .lead{margin:0 0 20px;color:var(--muted);font-size:13.5px;line-height:1.65}
  .field{display:block;margin-bottom:14px}
  .field>span{display:block;font-size:12.5px;color:#555;margin:0 2px 6px;font-weight:600}
  input[type=text]{
    width:100%;height:46px;border:1px solid #e6e6e6;background:#fff;border-radius:4px;
    padding:0 14px;font:inherit;font-size:16px;color:var(--ink);outline:none;transition:.15s;
  }
  input[type=text]:focus{background:#fff;border-color:#07c160;box-shadow:0 0 0 3px rgba(7,193,96,.12)}
  .check{display:flex;align-items:center;gap:7px;margin:-2px 2px 14px;font-size:12.5px;color:#555;cursor:pointer;user-select:none}
  .check input{width:15px;height:15px;accent-color:#07c160;margin:0;cursor:pointer;flex:none}
  .row{display:flex;gap:8px}
  .row input{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3px}
  button{font:inherit;cursor:pointer;border:0;transition:.15s;border-radius:4px}
  .primary{
    width:100%;height:48px;margin-top:6px;font-size:15.5px;font-weight:600;color:#fff;
    background:#07c160;
  }
  .primary:active{background:#06ad56}
  .primary[disabled]{opacity:.6;cursor:default}
  .ghost{background:transparent;color:#555;padding:7px 10px;font-size:13px;border-radius:4px;white-space:nowrap}
  .ghost:hover{background:#e6e6e6;color:#1a1a1a}
  .hint{margin:14px 2px 0;font-size:12px;line-height:1.6;color:var(--muted)}
  .err{margin:10px 2px 0;font-size:12.5px;color:var(--bad)}

  /* 聊天 */
  .chat{
    width:min(880px,100%);height:min(calc(100dvh - 36px),920px);position:relative;
    background:var(--chat-bg);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 8px 28px rgba(0,0,0,.14);
    border:1px solid #d6d6d6;
  }
  .topbar{
    display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #d9d9d9;
    background:var(--bar-bg);
  }
  .who{min-width:0;flex:1}
  .room{display:flex;align-items:center;gap:6px;font-weight:650;font-size:15px}
  .room .lock{font-size:12px;opacity:.75}
  .room em{font-style:normal;color:var(--muted);font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;flex:none}
  .dot.online{background:var(--ok);box-shadow:0 0 0 3px rgba(63,138,95,.16)}
  .dot.offline{background:var(--bad);box-shadow:0 0 0 3px rgba(179,64,46,.13)}
  .dot.connecting{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .actions{display:flex;gap:2px;flex:none}
  #moreBtn{font-size:16px;line-height:1;letter-spacing:1px;padding:5px 9px}

  .logwrap{flex:1;min-height:0;position:relative;display:flex}
  .log{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px 6px;
    display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;
    background:var(--chat-bg);
  }
  .jump{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
    background:#07c160;color:#fff;
    font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:4px;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .jump:hover{filter:brightness(1.06)}
  .jump:active{transform:translateX(-50%) translateY(1px)}
  .empty{margin:auto;text-align:center;color:var(--muted);padding:24px}
  .emptyIcon{font-size:34px;margin-bottom:8px}
  .empty p{margin:4px 0;font-size:14px}
  .empty .small{font-size:12px;opacity:.8}
  .sys{align-self:center;font-size:12px;color:#a99f8e;background:#f2ead9;padding:5px 12px;border-radius:999px;margin:8px 0}

  .msg{display:flex;gap:10px;margin:3px 0;max-width:100%;animation:pop .18s ease-out;position:relative}
  .msg.start{margin-top:18px}
  .msg.own{flex-direction:row-reverse}
  .ava{
    width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:600;user-select:none;
    background:hsl(var(--av-h, 212), 70%, 94%);
    color:hsl(var(--av-h, 212), 45%, 40%);
    border:1px solid hsl(var(--av-h, 212), 40%, 88%);
  }
  .msg.cont .ava{visibility:hidden}
  .body{display:flex;flex-direction:column;max-width:min(72%,520px);min-width:0;position:relative}
  .msg.own .body{align-items:flex-end}
  .name{font-size:11.5px;color:#8f8f8f;margin:0 3px 5px}
  .bubble{
    position:relative;padding:10px 14px;border-radius:7px;font-size:15px;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
    background:var(--bub-other);color:var(--bub-other-ink);
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .bubble::before{
    content:"";position:absolute;top:13px;left:-4px;width:9px;height:9px;
    background:inherit;transform:rotate(45deg);border-radius:1px;
  }
  .msg.own .bubble{background:var(--bub-own);color:var(--bub-own-ink)}
  .msg.own .bubble::before{left:auto;right:-4px}
  .meta{font-size:10.5px;line-height:1.3;color:#b3b3b3;margin:5px 2px 0;white-space:nowrap}
  .status{font-size:10.5px;line-height:1.3;color:#b3b3b3;white-space:nowrap;margin:5px 2px 0}
  .status.read{color:#07c160}
  .msg.failed .meta{color:var(--bad)}
  .msg.failed .bubble{opacity:.55}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .foot{display:flex;align-items:center;gap:8px;margin:0;min-height:0}
  .msg.own .foot{flex-direction:row-reverse}
  .hover-time{
    position:absolute;top:50%;left:100%;margin-left:8px;transform:translateY(-50%);
    font-size:10.5px;color:#b3b3b3;white-space:nowrap;user-select:none;-webkit-user-select:none;
    opacity:0;pointer-events:none;transition:opacity .15s ease;
  }
  .msg.own .hover-time{left:auto;right:100%;margin-right:8px;margin-left:0}
  @media (hover:hover){ .msg:hover .hover-time{opacity:1} }
  @media (hover:none){
    .hover-time{display:none}
    .bubble{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  }

  .ctxmenu{
    position:fixed;z-index:95;min-width:132px;padding:4px;
    background:#fff;border:1px solid #e2e2e2;border-radius:6px;
    box-shadow:0 8px 28px rgba(0,0,0,.16);
  }
  .cm-time{display:block;font-size:10.5px;color:#b3b3b3;padding:4px 9px 6px;border-bottom:1px solid #f0f0f0;margin-bottom:3px;user-select:none;-webkit-user-select:none}
  .cm-item{display:block;width:100%;text-align:left;background:transparent;border:0;font:inherit;font-size:13px;color:#1a1a1a;padding:7px 10px;border-radius:4px;cursor:pointer}
  .cm-item:hover{background:#f2f2f2}
  .cm-item.danger{color:#e64340}

  .quote{border-left:2px solid rgba(0,0,0,.15);padding:2px 0 2px 7px;margin:0 0 5px;font-size:12.5px;line-height:1.45;opacity:.85;cursor:pointer}
  .msg.other .quote{border-left-color:#d4d4d4}
  .quote .qn{font-weight:650;margin-right:4px}
  .msg.flash .bubble{outline:2px solid #07c160;outline-offset:2px}

  .composer{
    display:flex;gap:9px;align-items:flex-end;padding:9px 11px calc(9px + env(safe-area-inset-bottom));
    border-top:1px solid #d9d9d9;background:#f7f7f7;position:relative;
  }
  .counter{
    position:absolute;right:14px;bottom:calc(100% + 6px);font-size:10.5px;color:#8a8a8a;
    background:#fff;border:1px solid #e6e6e6;border-radius:3px;padding:2px 8px;
  }
  .quotebar{
    display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid #d9d9d9;
    background:#f7f7f7;
  }
  .quotebar .qb-main{flex:1;min-width:0;border-left:3px solid #07c160;padding-left:9px}
  .qb-name{display:block;font-size:11.5px;font-weight:650;color:#555}
  .qb-text{display:block;font-size:12.5px;color:#8a8a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qb-close{width:26px;height:26px;border-radius:3px;background:transparent;color:#8a8a8a;font-size:17px;line-height:1;flex:none}
  .qb-close:hover{background:#e6e6e6;color:#1a1a1a}

  .menu{
    position:absolute;top:54px;right:10px;z-index:30;width:180px;padding:5px;
    background:#fff;border:1px solid #e2e2e2;border-radius:4px;
    box-shadow:0 6px 24px rgba(0,0,0,.12);
  }
  .menu-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    padding:9px 10px;border-radius:3px;background:transparent;color:var(--ink);font-size:13.5px;text-align:left;
  }
  .menu-item:hover{background:#f0f0f0}
  .menu-item.danger{color:#e64340}
  .switch{width:32px;height:18px;border-radius:999px;background:#dcdcdc;position:relative;flex:none;transition:.15s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
  .menu-item[aria-checked=true] .switch{background:#07c160}
  .menu-item[aria-checked=true] .switch::after{left:16px}
  .menu-note{padding:7px 10px 3px;margin-top:4px;border-top:1px solid #ececec;font-size:11px;color:#a0a0a0}
  #msgInput{
    flex:1;resize:none;max-height:132px;min-height:38px;border:1px solid #e6e6e6;background:#fff;
    border-radius:4px;padding:9px 11px;font:inherit;font-size:16px;line-height:1.4;color:var(--ink);
    outline:none;transition:.15s;
  }
  #msgInput:focus{border-color:#07c160}
  #msgInput::placeholder{color:#b0b0b0}
  .send{width:auto;height:38px;margin:0;padding:0 16px;flex:none;border-radius:4px}
  .attach{
    width:34px;height:38px;flex:none;border-radius:4px;background:transparent;color:#4a4a4a;
    display:flex;align-items:center;justify-content:center;
  }
  .attach:hover{background:#e6e6e6}
  .emoji-panel{
    position:absolute;right:10px;bottom:calc(100% + 6px);z-index:25;
    width:min(304px,calc(100vw - 32px));max-height:236px;overflow-y:auto;
    display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;
    background:#fff;border:1px solid #e2e2e2;border-radius:4px;
    box-shadow:0 6px 24px rgba(0,0,0,.12);
  }
  .emoji{width:100%;aspect-ratio:1;border-radius:3px;background:transparent;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
  .emoji:hover{background:#f0f0f0}
  .bubble-img{padding:3px;background:#fff!important;border:0!important;box-shadow:none!important}
  .msg.own .bubble-img{background:#fff!important}
  .img{display:block;max-width:100%;max-height:300px;border-radius:3px;cursor:zoom-in}
  .imghint{font-size:12.5px;color:#8a8a8a;padding:10px 12px;text-align:center;min-width:120px}
  .imghint.bad{color:#e64340}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;max-width:86vw;
    background:rgba(0,0,0,.72);color:#fff;padding:10px 16px;border-radius:4px;font-size:13.5px;
    text-align:center;animation:pop .16s ease-out;
  }
  .modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.35)}
  .modal-card{width:min(360px,100%);background:#fff;border-radius:6px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .modal-card h3{margin:0 0 12px;font-size:16px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .modal-actions .primary{width:auto;height:36px;margin:0;padding:0 18px;font-size:14px}

  @media (max-width:700px){
    .app{padding:0}
    .chat{height:100dvh;border-radius:0;border:0;box-shadow:none}
    .card{margin:16px}
    .log{padding:12px 10px 4px}
    .body{max-width:calc(100vw - 90px)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  }

  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111111; --card:#1c1c1c; --ink:#e6e6e6; --muted:#7d7d7d; --line:#2a2a2a;
      --accent:#07c160; --accent2:#06ad56; --ok:#07c160; --warn:#f0a020; --bad:#e64340;
      --bub-other:#2c2c2c; --bub-other-ink:#e6e6e6; --bub-own:#3e8f62; --bub-own-ink:#f2f2f2;
      --chat-bg:#111111; --bar-bg:#1c1c1c; --input-bg:#1c1c1c;
    }
    body{background:var(--bg)}
    .card{background:#1c1c1c;border-color:#2a2a2a}
    .chat{background:var(--chat-bg);border-color:#2a2a2a}
    .topbar{background:var(--bar-bg);border-bottom-color:#2a2a2a}
    .log{background:var(--chat-bg)}
    .name{color:#7d7d7d}
    .ava{
      background:hsl(var(--av-h, 212), 26%, 19%);
      color:hsl(var(--av-h, 212), 55%, 74%);
      border-color:hsl(var(--av-h, 212), 22%, 26%);
    }
    .meta,.status{color:#6f6f6f}
    .status.read{color:#07c160}
    .field>span,.check{color:#b0b0b0}
    input[type=text]{background:#2c2c2c;border-color:#333;color:var(--ink)}
    input[type=text]:focus{border-color:#07c160}
    #msgInput{background:#2c2c2c;border-color:#333;color:var(--ink)}
    #msgInput:focus{border-color:#07c160}
    #msgInput::placeholder{color:#7d7d7d}
    .composer{background:var(--bar-bg);border-top-color:#2a2a2a}
    .counter{background:#2c2c2c;border-color:#333;color:#7d7d7d}
    .hover-time{color:#6f6f6f}
    .ctxmenu{background:#2c2c2c;border-color:#3a3a3a;box-shadow:0 8px 28px rgba(0,0,0,.5)}
    .cm-item{color:#e6e6e6}
    .cm-item:hover{background:#3a3a3a}
    .cm-time{color:#7d7d7d;border-bottom-color:#3a3a3a}
    .sys{color:#6f6f6f}
    .empty{color:var(--muted)}
    .menu{background:#2c2c2c;border-color:#3a3a3a;box-shadow:0 6px 24px rgba(0,0,0,.5)}
    .menu-item{color:var(--ink)}
    .menu-item:hover{background:#3a3a3a}
    .switch{background:#444}
    .menu-note{color:#7d7d7d;border-top-color:#3a3a3a}
    .ghost{color:#b0b0b0}
    .ghost:hover{background:#2c2c2c;color:#fff}
    .attach{color:#c9c9c9}
    .attach:hover{background:#2c2c2c}
    .emoji:hover{background:#3a3a3a}
    .emoji-panel{background:#2c2c2c;border-color:#3a3a3a}
    .bubble-img,.msg.own .bubble-img{background:#2c2c2c!important}
    .msg.other .quote{border-left-color:#4a4a4a}
    .quotebar{background:var(--bar-bg);border-top-color:#2a2a2a}
    .qb-name{color:#b0b0b0}
    .qb-text{color:#7d7d7d}
    .qb-close{color:#9a9a9a}
    .qb-close:hover{background:#2c2c2c;color:#fff}
    .toast{background:rgba(230,230,230,.95);color:#111}
    .msg.flash .bubble{outline-color:#07c160}
    .modal-card{background:#2c2c2c}
    .modal-card h3{color:var(--ink)}
  }
</style>
</head>
<body>
<div class="app">

  <section class="card" id="joinScreen">
    <div class="logo" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 11.6c0 4.6-4 8.3-9 8.3-.9 0-1.8-.1-2.6-.4L3.4 21l1.5-4.4A8 8 0 0 1 3 11.6c0-4.6 4-8.3 9-8.3s9 3.7 9 8.3Z" fill="#fff"/>
      </svg>
    </div>
    <h1>QINGLIAO</h1>
    <p class="lead">不用注册、不用装软件。你和对方打开同一个网页，填同一个房间口令，就能实时收到对方的消息。</p>
    <form id="joinForm" autocomplete="off">
      <label class="field">
        <span>你的昵称</span>
        <input type="text" id="nickInput" maxlength="12" placeholder="例如：小王">
      </label>
      <label class="field">
        <span>房间口令</span>
        <div class="row">
          <input type="text" id="roomInput" maxlength="40" placeholder="两人必须相同" spellcheck="false">
          <button type="button" class="ghost" id="rollBtn">换一个</button>
        </div>
      </label>
      <label class="check"><input type="checkbox" id="rememberChk"><span>在这台电脑上记住房间口令</span></label>
      <button type="submit" class="primary" id="enterBtn">进入聊天</button>
    </form>
    <p class="err" id="joinErr" hidden></p>
    <p class="hint">口令就是房间钥匙，只有口令相同的人才会进同一个房间。消息在浏览器里加密后再转发，中转只看到密文；本机保存的记录同样是密文。</p>
  </section>

  <section class="chat is-hidden" id="chatScreen">
    <header class="topbar">
      <div class="who">
        <div class="room"><span class="lock" id="lockIcon">🔒</span><span>房间</span><em id="roomName"></em></div>
        <div class="stat"><i class="dot connecting" id="dot"></i><span id="statText">连接中…</span></div>
      </div>
      <div class="actions">
        <button type="button" class="ghost" id="inviteBtn" title="复制邀请信息发给对方">邀请</button>
        <button type="button" class="ghost" id="reconnectBtn" title="手动重连">重连</button>
        <button type="button" class="ghost" id="moreBtn" title="更多选项" aria-haspopup="menu" aria-expanded="false">⋯</button>
        <button type="button" class="ghost" id="leaveBtn" title="回到进入页">退出</button>
      </div>
    </header>

    <div class="menu is-hidden" id="menu" role="menu">
      <button type="button" class="menu-item" id="notifyItem" role="menuitemcheckbox" aria-checked="false"><span>消息提醒</span><i class="switch"></i></button>
      <button type="button" class="menu-item" id="soundItem" role="menuitemcheckbox" aria-checked="false"><span>提示音</span><i class="switch"></i></button>
      <button type="button" class="menu-item" id="miniItem" role="menuitemcheckbox" aria-checked="false"><span>迷你窗口</span><i class="switch"></i></button>
      <button type="button" class="menu-item" id="renameItem" role="menuitem"><span>修改昵称</span></button>
      <button type="button" class="menu-item danger" id="clearBtn" role="menuitem">清空本机记录</button>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="3"/>

<noscript><p style="text-align:center;padding:20px">这个网页需要浏览器启用 JavaScript 才能使用。</p></noscript>

<script>
(function () {
  'use strict';

  var VERSION = '3.5.1';
  var APP_NAME = 'QINGLIAO';
  var MQTT_URL = 'wss://broker-cn.emqx.io:8084/mqtt';
  var MAX_LEN = 800;
  var HIST_MAX = 300;

  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- 基础工具 ---------------- */

  function cyrb53(str, seed) {
    var h1 = 0xdeadbeef ^ (seed || 0);
    var h2 = 0x41c6ce57 ^ (seed || 0);
    for (var i = 0; i < str.length; i++) {
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }

  function topicFor(room) {
    return 'ql-' + Math.floor(cyrb53('qingliao|v1|' + String(room).trim().toLowerCase())).toString(36);
  }

  function randCode() {
    var a = ['blue', 'green', 'happy', 'quiet', 'sunny', 'lucky', 'silver', 'warm', 'bright', 'fresh'];
    var b = ['tiger', 'panda', 'river', 'cloud', 'moon', 'star', 'leaf', 'bird', 'rock', 'wind'];
    var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
    return pick(a) + '-' + pick(b) + '-' + Math.floor(1000 + Math.random() * 9000);
  }

  function uid() {
    try {
      if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    } catch (e) { /* ignore */ }
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function fmtTime(ts) {
    var d = new Date(ts || Date.now());
    var now = new Date();
    var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    var sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    return sameDay ? hm : (pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + hm);
  }

  var AVA_HUES = [212, 152, 24, 265, 190, 340, 222, 44];

  function avatarHue(name) {
    var h = 0;
    name = String(name || '');
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return AVA_HUES[h % AVA_HUES.length];
  }

  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.remove('is-hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.add('is-hidden'); }, 2600);
  }

  /* ---------------- 加密 ---------------- */

  var HAS_CRYPTO = !!(window.crypto && window.crypto.subtle && window.TextEncoder);
  var TE = window.TextEncoder ? new TextEncoder() : null;
  var TD = window.TextDecoder ? new TextDecoder() : null;

  function toB64(bytes) {
    var out = '';
    var CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) {
      out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(out);
  }

  function fromB64(str) {
    var raw = atob(str);
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }

  function makeKey(room) {
    return window.crypto.subtle
      .importKey('raw', TE.encode('qingliao|' + String(room).trim().toLowerCase()), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: TE.encode('qingliao-salt-v1'), iterations: 120000, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
        );
      });
  }

  function makeHistKey(room) {
    return window.crypto.subtle
      .importKey('raw', TE.encode('qingliao-hist|' + String(room).trim().toLowerCase()), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: TE.encode('qingliao-hist-salt-v1'), iterations: 120000, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
        );
      });
  }

  function seal(key, obj) {
    var json = JSON.stringify(obj);
    if (!key) return Promise.resolve('p:' + toB64(TE.encode(json)));
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    return window.crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, TE.encode(json)).then(function (ct) {
      return 'e:' + toB64(iv) + '.' + toB64(new Uint8Array(ct));
    });
  }

  function unseal(key, payload) {
    if (typeof payload !== 'string' || payload.length < 3) return Promise.reject(new Error('bad payload'));
    if (payload.slice(0, 2) === 'p:') return Promise.resolve(JSON.parse(TD.decode(fromB64(payload.slice(2)))));
    if (payload.slice(0, 2) !== 'e:') return Promise.reject(new Error('unknown format'));
    if (!key) return Promise.reject(new Error('no key'));
    var rest = payload.slice(2);
    var dot = rest.indexOf('.');
    if (dot < 0) return Promise.reject(new Error('bad envelope'));
    var iv = fromB64(rest.slice(0, dot));
    var ct = fromB64(rest.slice(dot + 1));
    return window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct).then(function (pt) {
      return JSON.parse(TD.decode(new Uint8Array(pt)));
    });
  }

  /* ---------------- 状态 ---------------- */

  var S = {
    nick: '', room: '', topic: '', key: null, histKey: null,
    ws: null, reconnectTimer: null, pingTimer: null, mqttReady: false, lastRx: 0,
    quote: null, audio: null,
    seen: Object.create(null), hist: [], saveSeq: 0,
    retry: 0, unread: 0, pending: 0,
    clientId: '', connected: false,
    statusKind: 'connecting', statusText: '连接中…',
    peerReadTs: 0, lastIncomingTs: 0, readTimer: null, pendingReadTs: 0,
    lastSender: '', lastTs: 0, entered: false
  };

  S.clientId = uid();
  var MQTT_CLIENT_ID = '';

  function ensureMqttId() {
    var key = 'ql.mqid.' + S.topic;
    try {
      var v = localStorage.getItem(key);
      if (!v) { v = 'ql' + Math.random().toString(36).slice(2, 12); localStorage.setItem(key, v); }
      return v;
    } catch (e) {
      return 'ql' + Math.random().toString(36).slice(2, 12);
    }
  }

  var P = { notify: false, sound: false };
  try {
    var savedPref = JSON.parse(localStorage.getItem('ql.pref') || '{}');
    if (savedPref && typeof savedPref === 'object') {
      P.notify = !!savedPref.notify;
      P.sound = !!savedPref.sound;
    }
  } catch (e) { /* ignore */ }

  function savePref() {
    try { localStorage.setItem('ql.pref', JSON.stringify(P)); } catch (e) { /* ignore */ }
  }

  function ensureAudio() {
    try {
      if (S.audio) return S.audio;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      S.audio = new AC();
      return S.audio;
    } catch (e) { return null; }
  }

  function beep() {
    try {
      var ctx = ensureAudio();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.05, ctx.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.22);
    } catch (e) { /* ignore */ }
  }

  function notifyMessage(msg) {
    if (!document.hidden) return;
    if (P.sound) beep();
    if (!P.notify) return;
    try {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      var n = new Notification(String(msg.n || '对方') + ' · ' + APP_NAME, {
        body: msg.k === 'img' ? '[图片]' : String(msg.t || '').slice(0, 120),
        tag: msg.id,
        silent: true
      });
      n.onclick = function () {
        try { window.focus(); } catch (e) { /* ignore */ }
        n.close();
      };
    } catch (e) { /* ignore */ }
  }

  function setStatus(kind, text) {
    S.statusKind = kind;
    S.statusText = text;
    S.connected = kind === 'online';
    var dot = $('dot');
    dot.className = 'dot ' + kind;
    $('statText').textContent = text;
  }

  /* ---------------- 本地记录 ---------------- */

  function histKeyName() { return 'ql.hist.' + S.topic; }

  function shrinkHist() {
    if (S.hist.length > 40) {
      S.hist = S.hist.slice(Math.floor(S.hist.length / 2));
      return true;
    }
    var before = S.hist.length;
    S.hist = S.hist.filter(function (m) { return m.k !== 'img'; });
    return S.hist.length < before;
  }

  function saveHist() {
    var seq = ++S.saveSeq;
    var data = S.hist.slice();

    if (!S.histKey) {
      try { localStorage.setItem(histKeyName(), JSON.stringify(data)); }
      catch (e) { if (shrinkHist()) setTimeout(saveHist, 0); }
      return Promise.resolve();
    }

    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    return window.crypto.subtle
      .encrypt({ name: 'AES-GCM', iv: iv }, S.histKey, TE.encode(JSON.stringify(data)))
      .then(function (ct) {
        if (seq !== S.saveSeq) return;
        try {
          localStorage.setItem(histKeyName(), JSON.stringify({ v: 1, iv: toB64(iv), ct: toB64(new Uint8Array(ct)) }));
        } catch (e) {
          if (shrinkHist()) setTimeout(saveHist, 0);
        }
      })
      .catch(function () { /* ignore */ });
  }

  function loadHist() {
    S.hist = [];
    var raw = null;
    try { raw = localStorage.getItem(histKeyName()); } catch (e) { raw = null; }
    if (!raw) return Promise.resolve();

    var parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }

    if (Object.prototype.toString.call(parsed) === '[object Array]') {
      S.hist = parsed.slice(-HIST_MAX);
      saveHist();
      return Promise.resolve();
    }
    if (!parsed || typeof parsed !== 'object' || !parsed.iv || !parsed.ct || !S.histKey) return Promise.resolve();

    return window.crypto.subtle
      .decrypt({ name: 'AES-GCM', iv: fromB64(parsed.iv) }, S.histKey, fromB64(parsed.ct))
      .then(function (pt) {
        var arr = JSON.parse(TD.decode(new Uint8Array(pt)));
        if (Object.prototype.toString.call(arr) === '[object Array]') S.hist = arr.slice(-HIST_MAX);
      })
      .catch(function () { S.hist = []; });
  }

  function pushHist(msg) {
    S.hist.push(msg);
    if (S.hist.length > HIST_MAX) S.hist.splice(0, S.hist.length - HIST_MAX);
    saveHist();
  }

  function clearHist() {
    S.saveSeq++;
    try {
      localStorage.removeItem(histKeyName());
      localStorage.setItem('ql.clear.' + S.topic, String(Date.now()));
    } catch (e) { /* ignore */ }
    S.hist = [];
    S.lastSender = '';
    S.lastTs = 0;
    var logEl = $('log');
    var emptyEl = $('emptyState');
    while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
    emptyEl.classList.remove('is-hidden');
    logEl.appendChild(emptyEl);
    S.pending = 0;
    updateJump();
  }

  /* ---------------- 渲染 ---------------- */

  function nearBottom() {
    var el = $('log');
    return el.scrollHeight - el.scrollTop - el.clientHeight < 90;
  }

  function scrollDown(instant) {
    var el = $('log');
    requestAnimationFrame(function () {
      var top = el.scrollHeight;
      if (instant) el.style.scrollBehavior = 'auto';
      el.scrollTop = top;
      if (instant) el.style.scrollBehavior = '';
    });
  }

  function addSystem(text) {
    var el = document.createElement('div');
    el.className = 'sys';
    el.textContent = text;
    $('log').appendChild(el);
    scrollDown();
  }

  function renderMessage(msg, own, animate) {
    var empty = $('emptyState');
    if (empty) empty.classList.add('is-hidden');

    var wrap = document.createElement('div');
    wrap.className = 'msg ' + (own ? 'own' : 'other');
    if (animate === false) wrap.style.animation = 'none';
    if (msg.id) wrap.setAttribute('data-id', msg.id);
    if (msg.ts) wrap.setAttribute('data-ts', String(msg.ts));

    var key = own ? '__me__' : (msg.n || '对方');
    var gapMs = msg.ts && S.lastTs ? (msg.ts - S.lastTs) : 0;
    var startGroup = S.lastSender !== key || gapMs > 5 * 60 * 1000;
    if (startGroup) wrap.classList.add('start');
    else wrap.classList.add('cont');
    var showName = !own && startGroup;

    var ava = document.createElement('div');
    ava.className = 'ava';
    ava.textContent = String(msg.n || '?').slice(0, 1);
    ava.style.setProperty('--av-h', String(avatarHue(msg.n || '')));

    var body = document.createElement('div');
    body.className = 'body';

    if (showName) {
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = msg.n || '对方';
      body.appendChild(name);
    }

    var bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (msg.k === 'img') {
      bubble.classList.add('bubble-img');
      var img = document.createElement('img');
      img.className = 'img';
      img.alt = '图片';
      img.addEventListener('click', function (ev) {
        ev.stopPropagation();
        try { window.open(img.src, '_blank'); } catch (e) { /* ignore */ }
      });
      bubble.appendChild(img);
      if (msg.local) img.src = msg.local;
      else loadImageInto(msg, img, bubble);
      body.appendChild(bubble);

      var imgFoot = document.createElement('div');
      imgFoot.className = 'foot';
      var imgTime = document.createElement('span');
      imgTime.className = 'hover-time';
      imgTime.textContent = fmtTime(msg.ts);
      body.appendChild(imgTime);
      body.appendChild(imgFoot);

      wrap.appendChild(ava);
      wrap.appendChild(body);
      wrap.__msg = msg;
      msg.__own = own;
      $('log').appendChild(wrap);
      S.lastSender = key;
      S.lastTs = msg.ts || Date.now();
      if (own) refreshOwnStatus();
      return;
    }

    if (msg.q && msg.q.id) {
      var quoted = document.createElement('div');
      quoted.className = 'quote';
      quoted.title = '点击跳转到原消息';
      var qn = document.createElement('span');
      qn.className = 'qn';
      qn.textContent = (msg.q.n || '对方') + '：';
      var qt = document.createElement('span');
      qt.className = 'qt';
      qt.textContent = String(msg.q.t || '').slice(0, 60);
      quoted.appendChild(qn);
      quoted.appendChild(qt);
      quoted.addEventListener('click', function (ev) {
        ev.stopPropagation();
        jumpTo(msg.q.id);
      });
      bubble.appendChild(quoted);
    }

    bubble.appendChild(document.createTextNode(msg.t));
    body.appendChild(bubble);

    bubble.addEventListener('dblclick', function (ev) {
      ev.stopPropagation();
      var sel = window.getSelection ? window.getSelection() : null;
      if (sel && sel.removeAllRanges) {
        try { sel.removeAllRanges(); } catch (e) { /* ignore */ }
      }
      copyText(String(msg.t || '')).then(function (ok) {
        toast(ok ? '已复制这条消息' : '复制失败，请手动选中');
      });
    });

    var timeEl = document.createElement('span');
    timeEl.className = 'hover-time';
    timeEl.textContent = fmtTime(msg.ts);
    body.appendChild(timeEl);

    var foot = document.createElement('div');
    foot.className = 'foot';
    body.appendChild(foot);

    wrap.appendChild(ava);
    wrap.appendChild(body);
    wrap.__msg = msg;
    msg.__own = own;
    $('log').appendChild(wrap);
    S.lastSender = key;
    S.lastTs = msg.ts || Date.now();
    if (own) refreshOwnStatus();
  }

  function refreshOwnStatus() {
    var logEl = $('log');
    var old = logEl.querySelectorAll('.status');
    for (var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
    var owns = logEl.querySelectorAll('.msg.own');
    if (!owns.length) return;
    var last = owns[owns.length - 1];
    var t = Number(last.getAttribute('data-ts')) || 0;
    var read = t && S.peerReadTs && t <= S.peerReadTs;
    var foot = last.querySelector('.foot');
    if (!foot) return;
    var st = document.createElement('span');
    st.className = 'status' + (read ? ' read' : '');
    st.textContent = read ? '已读' : '未读';
    foot.appendChild(st);
  }

  function startQuote(msg) {
    if (!msg || !msg.id) return;
    var label = msg.k === 'img' ? '[图片]' : String(msg.t || '');
    S.quote = { id: msg.id, n: String(msg.n || '对方').slice(0, 24), t: label.slice(0, 80) };
    $('qbName').textContent = (msg.n || '对方') + '：';
    $('qbText').textContent = label.slice(0, 80);
    $('quoteBar').classList.remove('is-hidden');
    $('msgInput').focus();
    scrollDown(true);
  }

  function clearQuote() {
    S.quote = null;
    $('quoteBar').classList.add('is-hidden');
  }

  function jumpTo(id) {
    var el = $('log').querySelector('[data-id="' + id + '"]');
    if (!el) { toast('这条消息不在本机记录里'); return; }
    try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
    el.classList.add('flash');
    setTimeout(function () { el.classList.remove('flash'); }, 1200);
  }

  var RECALL_WINDOW = 5 * 60 * 1000;

  function removeMessage(id, text) {
    if (!id) return;
    var el = $('log').querySelector('[data-id="' + id + '"]');
    if (el) {
      var note = document.createElement('div');
      note.className = 'sys';
      note.textContent = text;
      el.parentNode.replaceChild(note, el);
    }
    for (var i = 0; i < S.hist.length; i++) {
      if (S.hist[i].id === id) { S.hist.splice(i, 1); break; }
    }
    saveHist();
    refreshOwnStatus();
  }

  function recallMessage(msg) {
    if (!msg || !msg.id) return;
    if (Date.now() - (Number(msg.ts) || 0) > RECALL_WINDOW) {
      toast('超过 5 分钟，不能撤回了');
      return;
    }
    msg.recalled = true;
    removeMessage(msg.id, '你撤回了一条消息');
    sendControl({ k: 'del', mid: msg.id });
    if (msg.k !== 'img' && typeof msg.t === 'string') {
      var el = $('msgInput');
      el.value = msg.t;
      autoGrow();
      updateCounter();
      try { el.focus(); } catch (e) { /* ignore */ }
      toast('已撤回，改完可以直接再发');
    } else {
      toast('已撤回');
    }
  }

  var ctxMsg = null;

  function openCtxMenu(msg, x, y) {
    var el = $('ctxMenu');
    if (!el || !msg) return;
    ctxMsg = msg;
    $('cmTime').textContent = fmtTime(msg.ts);
    $('cmCopy').classList.toggle('is-hidden', msg.k === 'img');
    $('cmRecall').classList.toggle('is-hidden', !msg.__own);
    el.classList.remove('is-hidden');
    var rect = el.getBoundingClientRect();
    var left = Math.min(x, window.innerWidth - rect.width - 8);
    var top = Math.min(y, window.innerHeight - rect.height - 8);
    el.style.left = Math.max(8, left) + 'px';
    el.style.top = Math.max(8, top) + 'px';
  }

  function closeCtxMenu() {
    var el = $('ctxMenu');
    if (el) el.classList.add('is-hidden');
    ctxMsg = null;
  }

  function updateJump() {
    var btn = $('jumpBtn');
    if (!btn) return;
    if (S.pending > 0) {
      btn.textContent = (S.pending > 99 ? '99+' : S.pending) + ' 条新消息 ↓';
      btn.classList.remove('is-hidden');
    } else {
      btn.classList.add('is-hidden');
    }
  }

  function resetJump() {
    S.pending = 0;
    updateJump();
  }

  /* ---------------- 已读回执 ---------------- */

  function sendControl(payload) {
    if (!S.entered) return;
    payload.v = 1;
    payload.c = S.clientId;
    payload.at = Date.now();
    payload.id = payload.id || uid();
    S.seen[payload.id] = 1;
    seal(S.key, payload).then(publish).catch(function () { /* ignore */ });
  }

  function onPeerRead(ts) {
    ts = Number(ts) || 0;
    if (!ts) return;
    if (ts > S.peerReadTs) {
      S.peerReadTs = ts;
      refreshOwnStatus();
    }
  }

  function scheduleRead(ts) {
    S.lastIncomingTs = Math.max(S.lastIncomingTs, Number(ts) || 0);
    S.pendingReadTs = Math.max(S.pendingReadTs, Number(ts) || 0);
    if (S.readTimer) return;
    S.readTimer = setTimeout(function () {
      S.readTimer = null;
      var t = S.pendingReadTs;
      S.pendingReadTs = 0;
      if (t) sendControl({ k: 'r', ts: t });
    }, 400);
  }

  function markVisibleRead() {
    if (document.visibilityState !== 'visible' || !document.hasFocus()) return;
    if (S.lastIncomingTs) scheduleRead(S.lastIncomingTs);
  }

  /* ---------------- 未读 / 标题 / 图标 / 小窗 ---------------- */

  function updateTitle() {
    document.title = S.unread ? '(' + S.unread + ') ' + APP_NAME : APP_NAME;
    setFavicon(S.unread > 0);
  }

  function makeFavicon(withDot) {
    try {
      var c = document.createElement('canvas');
      c.width = c.height = 64;
      var x = c.getContext('2d');
      if (!x) return null;
      var g = x.createLinearGradient(0, 0, 64, 64);
      g.addColorStop(0, '#07c160');
      g.addColorStop(1, '#06ad56');
      x.fillStyle = g;
      var r = 14;
      x.beginPath();
      x.moveTo(r, 0); x.lineTo(64 - r, 0);
      x.quadraticCurveTo(64, 0, 64, r); x.lineTo(64, 64 - r);
      x.quadraticCurveTo(64, 64, 64 - r, 64); x.lineTo(r, 64);
      x.quadraticCurveTo(0, 64, 0, 64 - r); x.lineTo(0, r);
      x.quadraticCurveTo(0, 0, r, 0);
      x.closePath(); x.fill();
      x.fillStyle = '#fff';
      x.beginPath();
      x.moveTo(16, 20); x.lineTo(48, 20);
      x.quadraticCurveTo(52, 20, 52, 24); x.lineTo(52, 38);
      x.quadraticCurveTo(52, 42, 48, 42); x.lineTo(30, 42);
      x.lineTo(22, 48); x.lineTo(22, 42); x.lineTo(16, 42);
      x.quadraticCurveTo(12, 42, 12, 38); x.lineTo(12, 24);
      x.quadraticCurveTo(12, 20, 16, 20);
      x.closePath(); x.fill();
      if (withDot) {
        x.beginPath();
        x.arc(50, 14, 13, 0, Math.PI * 2);
        x.fillStyle = '#f2b01e';
        x.fill();
      }
      return c.toDataURL('image/png');
    } catch (e) { return null; }
  }

  var faviconOn = null;
  var faviconOff = null;

  function setFavicon(hot) {
    try {
      if (!faviconOff) { faviconOff = makeFavicon(false); faviconOn = makeFavicon(true); }
      var url = hot ? faviconOn : faviconOff;
      if (!url) return;
      var link = document.querySelector('link[rel="icon"]');
      if (link) link.href = url;
    } catch (e) { /* ignore */ }
  }

  var pipWin = null;

  function renderMini() {
    if (!pipWin || pipWin.closed) return;
    var doc = pipWin.document;
    var dot = doc.getElementById('miniDot');
    var ring = doc.getElementById('miniRing');
    var edge = doc.getElementById('miniEdge');
    if (!dot) return;
    if (S.unread > 0) {
      dot.style.background = '#f2b01e';
      dot.style.boxShadow = '0 0 0 5px rgba(242,176,30,.14)';
      dot.className = 'on';
      if (ring) ring.className = 'on';
      if (edge) edge.className = 'on';
    } else {
      dot.style.background = '#3b4050';
      dot.style.boxShadow = 'none';
      dot.className = '';
      if (ring) ring.className = '';
      if (edge) edge.className = '';
    }
  }

  function bumpUnread() {
    if (!document.hidden && document.hasFocus()) return;
    S.unread++;
    updateTitle();
    renderMini();
  }

  function clearUnread() {
    if (S.unread === 0) { renderMini(); return; }
    S.unread = 0;
    updateTitle();
    renderMini();
  }

  function positionMiniDot() {
    if (!pipWin || pipWin.closed) return;
    var win = pipWin;
    var anchor = win.document.getElementById('miniAnchor');
    if (!anchor) return;

    var iw = win.innerWidth || 0;
    var ih = win.innerHeight || 0;
    if (!iw || !ih) return;

    var cx = iw / 2;
    var cy = ih / 2;

    var sx = win.screenX;
    var sy = win.screenY;
    var scr = win.screen;

    if (typeof sx === 'number' && typeof sy === 'number' && scr) {
      var ow = win.outerWidth || iw;
      var oh = win.outerHeight || ih;
      var frameX = Math.max(0, (ow - iw) / 2);
      var frameTop = Math.max(0, oh - ih - frameX);
      var contentX = sx + frameX;
      var contentY = sy + frameTop;

      var availLeft = (typeof scr.availLeft === 'number') ? scr.availLeft : 0;
      var availTop = (typeof scr.availTop === 'number') ? scr.availTop : 0;
      var availW = scr.availWidth || scr.width || iw;
      var availH = scr.availHeight || scr.height || ih;
      var scrRight = availLeft + availW;
      var scrBottom = availTop + availH;

      var visLeft = Math.max(0, availLeft - contentX);
      var visRight = Math.min(iw, scrRight - contentX);
      var visTop = Math.max(0, availTop - contentY);
      var visBottom = Math.min(ih, scrBottom - contentY);

      if (visRight > visLeft) cx = (visLeft + visRight) / 2;
      if (visBottom > visTop) cy = (visTop + visBottom) / 2;
    }

    cx = Math.min(Math.max(cx, 9), Math.max(9, iw - 9));
    cy = Math.min(Math.max(cy, 9), Math.max(9, ih - 9));

    anchor.style.left = Math.round(cx) + 'px';
    anchor.style.top = Math.round(cy) + 'px';
  }

  function closeMini() {
    if (pipWin && !pipWin.closed) {
      try { pipWin.close(); } catch (e) { /* ignore */ }
    }
  }

  function toggleMini() {
    if (!('documentPictureInPicture' in window)) {
      toast('这个浏览器不支持迷你窗口（需要 Chrome / Edge 116 以上）');
      return;
    }
    if (pipWin && !pipWin.closed) {
      closeMini();
      return;
    }

    window.documentPictureInPicture.requestWindow({ width: 64, height: 40 }).then(function (win) {
      pipWin = win;
      $('miniItem').setAttribute('aria-checked', 'true');
      try { win.document.title = '·'; } catch (e) { /* ignore */ }

      var doc = win.document;
      if (doc.documentElement) doc.documentElement.style.cssText = 'margin:0;padding:0;height:100%;overflow:hidden;background:#111318;';
      if (doc.body) doc.body.style.cssText = 'margin:0;padding:0;height:100%;overflow:hidden;background:#111318;';

      var wrap = doc.createElement('div');
      wrap.id = 'miniWrap';
      wrap.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;background:#111318;cursor:pointer;-webkit-user-select:none;user-select:none;overflow:hidden;';

      var anchor = doc.createElement('div');
      anchor.id = 'miniAnchor';
      anchor.style.cssText = 'position:absolute;left:50%;top:50%;width:0;height:0;';

      var ring = doc.createElement('div');
      ring.id = 'miniRing';
      ring.style.cssText = 'position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;border:2px solid rgba(242,176,30,.75);opacity:0;box-sizing:border-box;';

      var dot = doc.createElement('div');
      dot.id = 'miniDot';
      dot.style.cssText = 'position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:#3b4050;transition:background .2s,box-shadow .2s;';

      var edge = doc.createElement('div');
      edge.id = 'miniEdge';
      edge.style.cssText = 'position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;';

      anchor.appendChild(ring);
      anchor.appendChild(dot);
      wrap.appendChild(anchor);
      wrap.appendChild(edge);
      doc.body.appendChild(wrap);

      var style = doc.createElement('style');
      style.textContent =
        '@keyframes qlBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}' +
        '@keyframes qlRipple{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.7);opacity:0}}' +
        '@keyframes qlEdge{0%,100%{box-shadow:inset 0 0 0 2px rgba(242,176,30,.28),inset 0 0 14px rgba(242,176,30,.10)}' +
        '50%{box-shadow:inset 0 0 0 3px rgba(242,176,30,.95),inset 0 0 22px rgba(242,176,30,.28)}}' +
        '#miniDot.on{animation:qlBreathe 2s ease-in-out infinite}' +
        '#miniRing.on{animation:qlRipple 2s ease-out infinite}' +
        '#miniEdge.on{animation:qlEdge 2s ease-in-out infinite}';
      (doc.head || doc.documentElement).appendChild(style);

      wrap.addEventListener('click', function () {
        clearUnread();
        try { window.focus(); } catch (e) { /* ignore */ }
      });

      positionMiniDot();
      var posTimer = win.setInterval(positionMiniDot, 200);

      win.addEventListener('pagehide', function () {
        try { win.clearInterval(posTimer); } catch (e) { /* ignore */ }
        pipWin = null;
        $('miniItem').setAttribute('aria-checked', 'false');
      });

      renderMini();
      toast('小窗已打开：有未读时黄灯呼吸，点一下回到聊天');
    }).catch(function (err) {
      toast('迷你窗口打开失败：' + String((err && err.message) || err));
    });
  }

  /* ---------------- MQTT ---------------- */

  var mqttBuf = new Uint8Array(0);

  function encLen(n) {
    var out = [];
    do {
      var b = n % 128;
      n = Math.floor(n / 128);
      if (n > 0) b |= 0x80;
      out.push(b);
    } while (n > 0);
    return out;
  }

  function mqttStr(s) {
    var bytes = new TextEncoder().encode(s);
    var out = new Uint8Array(2 + bytes.length);
    out[0] = (bytes.length >> 8) & 0xff;
    out[1] = bytes.length & 0xff;
    out.set(bytes, 2);
    return out;
  }

  function connectPacket(clientId) {
    var head = [0x00, 0x04, 0x4d, 0x51, 0x54, 0x54, 0x04, 0x00, 0x00, 0x3c];
    var payload = Array.prototype.slice.call(mqttStr(clientId));
    var body = head.concat(payload);
    return new Uint8Array([0x10].concat(encLen(body.length), body));
  }

  function subscribePacket(id, topic) {
    var t = Array.prototype.slice.call(mqttStr(topic));
    var body = [(id >> 8) & 0xff, id & 0xff].concat(t, [0x01]);
    return new Uint8Array([0x82].concat(encLen(body.length), body));
  }

  var pktSeq = 0;
  function nextPktId() {
    pktSeq = (pktSeq % 65535) + 1;
    return pktSeq;
  }

  function publishPacket(topic, payload) {
    var id = nextPktId();
    var body = Array.prototype.slice.call(mqttStr(topic))
      .concat([(id >> 8) & 0xff, id & 0xff])
      .concat(Array.prototype.slice.call(new TextEncoder().encode(payload)));
    return new Uint8Array([0x32].concat(encLen(body.length), body));
  }

  var PINGREQ = new Uint8Array([0xc0, 0x00]);

  function readVarLen(buf, pos) {
    var mult = 1, val = 0, i = pos;
    for (var guard = 0; guard < 4; guard++) {
      if (i >= buf.length) return null;
      var b = buf[i++];
      val += (b & 0x7f) * mult;
      if ((b & 0x80) === 0) return { value: val, next: i };
      mult *= 128;
    }
    return null;
  }

  function teardown() {
    var ws = S.ws;
    S.ws = null;
    S.mqttReady = false;
    if (S.pingTimer) { clearInterval(S.pingTimer); S.pingTimer = null; }
    if (ws) {
      try {
        ws.onclose = null; ws.onmessage = null; ws.onerror = null;
        ws.close();
      } catch (e) { /* ignore */ }
    }
    if (S.reconnectTimer) { clearTimeout(S.reconnectTimer); S.reconnectTimer = null; }
  }

  function scheduleReconnect() {
    if (!S.entered || S.reconnectTimer) return;
    var wait = Math.min(15000, 1200 * Math.pow(1.7, S.retry++));
    setStatus('offline', '已断开，' + Math.round(wait / 1000) + ' 秒后重连…');
    S.reconnectTimer = setTimeout(function () {
      S.reconnectTimer = null;
      connect();
    }, wait);
  }

  function connect() {
    if (!S.entered) return;
    teardown();
    setStatus('connecting', '连接中…');

    var ws;
    try {
      ws = new WebSocket(MQTT_URL, 'mqtt');
    } catch (e) {
      setStatus('offline', '无法连接');
      scheduleReconnect();
      return;
    }
    ws.binaryType = 'arraybuffer';
    S.ws = ws;
    mqttBuf = new Uint8Array(0);
    S.mqttReady = false;
    S.lastRx = Date.now();

    ws.onopen = function () {
      if (S.ws !== ws) return;
      try { ws.send(connectPacket(MQTT_CLIENT_ID)); } catch (e) { /* ignore */ }
    };

    ws.onmessage = function (ev) {
      if (S.ws !== ws) return;
      S.lastRx = Date.now();
      onMqttData(new Uint8Array(ev.data), ws);
    };

    ws.onerror = function () { /* ignore */ };

    ws.onclose = function () {
      if (S.ws !== ws) return;
      S.ws = null;
      S.mqttReady = false;
      if (S.pingTimer) { clearInterval(S.pingTimer); S.pingTimer = null; }
      scheduleReconnect();
    };
  }

  function onMqttData(chunk, ws) {
    var merged = new Uint8Array(mqttBuf.length + chunk.length);
    merged.set(mqttBuf, 0);
    merged.set(chunk, mqttBuf.length);
    mqttBuf = merged;

    while (true) {
      if (mqttBuf.length < 2) return;
      var r = readVarLen(mqttBuf, 1);
      if (!r) return;
      var total = r.next + r.value;
      if (mqttBuf.length < total) return;
      var type = mqttBuf[0] >> 4;
      var flags = mqttBuf[0] & 0x0f;
      var pkt = mqttBuf.slice(r.next, total);
      mqttBuf = mqttBuf.slice(total);

      if (type === 2) {
        if (pkt.length < 2 || pkt[1] !== 0) {
          setStatus('offline', '服务器拒绝连接');
          try { ws.close(); } catch (e) { /* ignore */ }
          return;
        }
        try { ws.send(subscribePacket(1, S.topic)); } catch (e) { /* ignore */ }
        S.pingTimer = setInterval(function () {
          try { if (ws.readyState === 1) ws.send(PINGREQ); } catch (e) { /* ignore */ }
        }, 30000);
        S.mqttReady = true;
        S.retry = 0;
        setStatus('online', '已连接');
      } else if (type === 3) {
        var qos = (flags & 0x06) >> 1;
        var tl = (pkt[0] << 8) | pkt[1];
        var pos = 2 + tl;
        var pid = 0;
        if (qos > 0) {
          pid = (pkt[pos] << 8) | pkt[pos + 1];
          pos += 2;
        }
        var payload = new TextDecoder().decode(pkt.slice(pos));
        if (qos === 1 && pid) {
          try { ws.send(new Uint8Array([0x40, 0x02, (pid >> 8) & 0xff, pid & 0xff])); } catch (e) { /* ignore */ }
        }
        if (payload) handleRaw(payload);
      } else if (type === 4 || type === 13) {
        S.lastRx = Date.now();
      }
    }
  }

  setInterval(function () {
    if (!S.entered || !S.ws || S.ws.readyState !== 1) return;
    if (S.mqttReady && S.lastRx && Date.now() - S.lastRx > 95000) {
      setStatus('offline', '连接可能已失效，正在重连…');
      S.retry = 0;
      connect();
    }
  }, 15000);

  function publish(body) {
    if (!S.ws || S.ws.readyState !== 1 || !S.mqttReady) return Promise.reject(new Error('尚未连接'));
    try {
      var bytes = publishPacket(S.topic, body);
      if (bytes.length > 900 * 1024) return Promise.reject(new Error('消息太大'));
      S.ws.send(bytes);
      return Promise.resolve(true);
    } catch (e) {
      return Promise.reject(e);
    }
  }

  function handleRaw(sealed) {
    if (!sealed) return;
    return unseal(S.key, sealed).then(function (env) {
      if (env && env.k === 'del') {
        if (env.c && env.c === S.clientId) return;
        removeMessage(String(env.mid || ''), '对方撤回了一条消息');
        return;
      }
      if (env && env.k === 'r') {
        if (env.c && env.c === S.clientId) return;
        if (Date.now() - (Number(env.at) || 0) > 20000) return;
        onPeerRead(env.ts);
        return;
      }
      if (!env || (!env.t && env.k !== 'img')) return;
      if (env.id && S.seen[env.id]) return;
      if (env.id) S.seen[env.id] = 1;

      var msg;
      if (env.k === 'img') {
        if (!env.d || !env.iv) return;
        msg = {
          id: env.id || uid(),
          n: String(env.n || '对方').slice(0, 24),
          ts: Number(env.ts) || Date.now(),
          k: 'img',
          d: String(env.d),
          iv: String(env.iv),
          w: Number(env.w) || 0,
          h: Number(env.h) || 0
        };
      } else {
        msg = {
          id: env.id || uid(),
          n: String(env.n || '对方').slice(0, 24),
          t: String(env.t).slice(0, MAX_LEN),
          ts: Number(env.ts) || Date.now()
        };
      }
      if (env.q && env.q.id) {
        msg.q = {
          id: String(env.q.id).slice(0, 64),
          n: String(env.q.n || '').slice(0, 24),
          t: String(env.q.t || '').slice(0, 80)
        };
      }

      var wasNear = nearBottom();
      renderMessage(msg, false, true);
      pushHist(msg);
      S.lastIncomingTs = Math.max(S.lastIncomingTs, msg.ts || 0);
      if (document.visibilityState === 'visible' && document.hasFocus()) scheduleRead(msg.ts);
      if (wasNear) {
        scrollDown();
      } else {
        S.pending++;
        updateJump();
      }
      bumpUnread();
      notifyMessage(msg);
    }).catch(function () {
      addSystem('收到一条无法解密的消息（对方的房间口令可能不一致）');
    });
  }

  /* ---------------- 图片 ---------------- */

  var IMG_MAX_SIDE = 1400;
  var IMG_QUALITY = 0.75;

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if (!w || !h) throw new Error('图片尺寸异常');
          var scale = Math.min(1, IMG_MAX_SIDE / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var c = document.createElement('canvas');
          c.width = cw; c.height = ch;
          var x = c.getContext('2d');
          x.fillStyle = '#ffffff';
          x.fillRect(0, 0, cw, ch);
          x.drawImage(img, 0, 0, cw, ch);
          URL.revokeObjectURL(url);
          c.toBlob(function (blob) {
            if (!blob) { reject(new Error('压缩失败')); return; }
            resolve({ blob: blob, w: cw, h: ch });
          }, 'image/jpeg', IMG_QUALITY);
        } catch (e) {
          URL.revokeObjectURL(url);
          reject(e);
        }
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('不是有效的图片文件'));
      };
      img.src = url;
    });
  }

  function encryptBytes(buf) {
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    return window.crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, S.key, buf).then(function (ct) {
      return { data: new Uint8Array(ct), iv: toB64(iv) };
    });
  }

  function loadImageInto(msg, img, bubble) {
    var hint = document.createElement('div');
    hint.className = 'imghint';
    hint.textContent = '图片加载中…';
    bubble.appendChild(hint);

    try {
      var bin = fromB64(msg.d);
      window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(msg.iv) }, S.key, bin)
        .then(function (pt) {
          var blob = new Blob([pt], { type: 'image/jpeg' });
          img.src = URL.createObjectURL(blob);
          if (hint.parentNode) hint.parentNode.removeChild(hint);
        })
        .catch(function () {
          hint.textContent = '图片解密失败';
          hint.classList.add('bad');
        });
    } catch (e) {
      hint.textContent = '图片数据损坏';
      hint.classList.add('bad');
    }
  }

  function sendImage(file) {
    if (!S.entered) return Promise.resolve(false);
    if (!file || !/^image\//.test(file.type || '')) { toast('这个文件不是图片'); return Promise.resolve(false); }
    if (!window.crypto || !window.crypto.subtle || !S.key) { toast('当前浏览器环境不支持加密，不能发图片'); return Promise.resolve(false); }
    if (file.size > 10 * 1024 * 1024) { toast('图片太大了（上限 10MB）'); return Promise.resolve(false); }

    toast('正在处理图片…');

    return compressImage(file).then(function (res) {
      if (res.blob.size > 350 * 1024) throw new Error('压缩后仍然太大，换一张小一点的');
      return res.blob.arrayBuffer().then(function (buf) {
        return encryptBytes(buf).then(function (enc) {
          var b64 = toB64(enc.data);
          if (b64.length > 520 * 1024) throw new Error('图片太大，换一张小一点的');
          var localUrl = URL.createObjectURL(res.blob);
          var msg = {
            v: 1, id: uid(), n: S.nick, ts: Date.now(), me: 1,
            k: 'img', d: b64, iv: enc.iv, w: res.w, h: res.h
          };
          S.seen[msg.id] = 1;
          renderMessage({
            id: msg.id, n: msg.n, ts: msg.ts, k: 'img',
            d: b64, iv: msg.iv, w: msg.w, h: msg.h, local: localUrl
          }, true, true);
          pushHist(msg);
          scrollDown(true);
          resetJump();
          return seal(S.key, msg).then(publish).then(function () {
            toast('图片已发送');
            return true;
          });
        });
      });
    }).catch(function (err) {
      toast('图片发送失败：' + String((err && err.message) || err));
      return false;
    });
  }

  /* ---------------- 发送 ---------------- */

  function describeSendError(err) {
    var m = String((err && err.message) || err || '');
    if (m.indexOf('尚未连接') >= 0) return '还没连上服务器，点消息可重试';
    if (m.indexOf('消息太大') >= 0) return '消息太大，发短一点';
    return '发送失败（' + (m || '未知原因') + '），点消息可重试';
  }

  function sendMessage(text) {
    if (!S.entered) return Promise.resolve(false);
    text = String(text == null ? '' : text).replace(/^\s+|\s+$/g, '').slice(0, MAX_LEN);
    if (!text) return Promise.resolve(false);

    var env = { v: 1, id: uid(), n: S.nick, t: text, ts: Date.now(), me: 1 };
    if (S.quote && S.quote.id) env.q = { id: S.quote.id, n: S.quote.n, t: S.quote.t };
    S.seen[env.id] = 1;

    renderMessage(env, true, true);
    pushHist(env);
    clearQuote();
    scrollDown(true);
    resetJump();
    setTimeout(function () { scrollDown(true); }, 60);

    return seal(S.key, env)
      .then(publish)
      .then(function () { return true; })
      .catch(function (err) {
        markFailed(env.id);
        toast(describeSendError(err));
        return false;
      });
  }

  function markFailed(id) {
    var el = $('log').querySelector('[data-id="' + id + '"]');
    if (!el) return;
    el.classList.add('failed');
    var meta = el.querySelector('.meta');
    if (!meta) {
      meta = document.createElement('span');
      meta.className = 'meta';
      var f = el.querySelector('.foot');
      if (f) f.appendChild(meta); else el.appendChild(meta);
    }
    meta.hidden = false;
    meta.textContent = '未发送（点击重试）';
    var st = el.querySelector('.status');
    if (st) st.parentNode.removeChild(st);
    el.style.cursor = 'pointer';
    el.addEventListener('click', function () { retry(id); }, { once: true });
  }

  function retry(id) {
    var msg = null;
    for (var i = 0; i < S.hist.length; i++) if (S.hist[i].id === id) msg = S.hist[i];
    if (!msg) return;
    var el = $('log').querySelector('[data-id="' + id + '"]');
    if (el) {
      el.classList.remove('failed');
      var meta = el.querySelector('.meta');
      if (meta) meta.textContent = fmtTime(msg.ts);
    }
    seal(S.key, msg).then(publish).then(function () {
      toast('已重新发送');
    }).catch(function (err) {
      markFailed(id);
      toast(describeSendError(err));
    });
  }

  /* ---------------- 进入 / 退出 / 改名 ---------------- */

  function showJoinError(text) {
    var el = $('joinErr');
    if (!text) { el.hidden = true; return; }
    el.textContent = text;
    el.hidden = false;
  }

  function enter() {
    if (S.entered) return;
    var nick = $('nickInput').value.replace(/^\s+|\s+$/g, '').slice(0, 12);
    var room = $('roomInput').value.replace(/^\s+|\s+$/g, '');

    if (!nick) { showJoinError('请先填一个昵称'); $('nickInput').focus(); return; }
    if (room.length < 2) { showJoinError('房间口令至少 2 个字符'); $('roomInput').focus(); return; }

    showJoinError('');
    if (room.length < 8) toast('口令偏短：建议至少 8 位，或点「换一个」用随机口令');

    $('enterBtn').disabled = true;
    $('enterBtn').textContent = '正在进入…';

    S.nick = nick;
    S.room = room;
    S.topic = topicFor(room);
    MQTT_CLIENT_ID = ensureMqttId();
    S.startedAt = Date.now();
    S.seen = Object.create(null);
    S.entered = true;
    S.retry = 0;
    S.lastSender = '';
    S.lastTs = 0;
    S.lastRx = 0;
    S.mqttReady = false;
    S.unread = 0;
    S.pending = 0;
    S.peerReadTs = 0;
    S.lastIncomingTs = 0;
    S.pendingReadTs = 0;
    clearTimeout(S.readTimer);
    S.readTimer = null;
    updateTitle();
    renderMini();
    updateJump();
    clearQuote();
    $('menu').classList.add('is-hidden');
    $('moreBtn').setAttribute('aria-expanded', 'false');
    $('chatScreen').style.height = '';

    try {
      localStorage.setItem('ql.nick', nick);
      if ($('rememberChk') && $('rememberChk').checked) localStorage.setItem('ql.room', room);
      else localStorage.removeItem('ql.room');
    } catch (e) { /* ignore */ }

    $('roomName').textContent = room;

    var ready = HAS_CRYPTO
      ? Promise.all([makeKey(room), makeHistKey(room)]).then(function (keys) {
          S.key = keys[0];
          S.histKey = keys[1];
        }).catch(function () { S.key = null; S.histKey = null; })
      : Promise.resolve();

    ready.then(function () {
      $('lockIcon').textContent = S.key ? '🔒' : '🔓';
      $('lockIcon').title = S.key ? '消息已端到端加密，本地记录也已加密' : '当前浏览器不支持加密，消息与本地记录均为明文';
      $('joinScreen').classList.add('is-hidden');
      $('chatScreen').classList.remove('is-hidden');
      $('enterBtn').disabled = false;
      $('enterBtn').textContent = '进入聊天';

      var logEl = $('log');
      var emptyEl = $('emptyState');
      while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
      emptyEl.classList.remove('is-hidden');
      logEl.appendChild(emptyEl);

      return loadHist();
    }).then(function () {
      for (var i = 0; i < S.hist.length; i++) {
        renderMessage(S.hist[i], S.hist[i].me === 1 || S.hist[i].n === S.nick, false);
      }
      if (S.hist.length) {
        addSystem('以上是这台电脑上保存的历史消息');
        scrollDown();
      }
      for (var j = 0; j < S.hist.length; j++) {
        if (S.hist[j].id) S.seen[S.hist[j].id] = 1;
      }

      if (!HAS_CRYPTO) toast('浏览器不支持加密，消息将以明文发送');
      connect();
      var touchOnly = false;
      try { touchOnly = window.matchMedia('(hover: none)').matches; } catch (e) { /* ignore */ }
      if (!touchOnly) setTimeout(function () { $('msgInput').focus(); }, 60);
    });
  }

  function leave() {
    S.entered = false;
    teardown();
    setStatus('offline', '已退出');
    clearQuote();
    $('menu').classList.add('is-hidden');
    $('moreBtn').setAttribute('aria-expanded', 'false');
    $('chatScreen').style.height = '';
    $('chatScreen').classList.add('is-hidden');
    $('joinScreen').classList.remove('is-hidden');
    S.unread = 0;
    S.pending = 0;
    updateTitle();
    renderMini();
    updateJump();
  }

  function openRename() {
    if (!S.entered) return;
    $('renameInput').value = S.nick;
    $('renameModal').classList.remove('is-hidden');
    setTimeout(function () {
      var el = $('renameInput');
      try { el.focus(); el.select(); } catch (e) { /* ignore */ }
    }, 30);
  }

  function closeRename() {
    $('renameModal').classList.add('is-hidden');
  }

  function saveRename() {
    var v = $('renameInput').value.replace(/^\s+|\s+$/g, '').slice(0, 12);
    if (!v) { toast('昵称不能为空'); return; }
    S.nick = v;
    if ($('nickInput')) $('nickInput').value = v;
    try { localStorage.setItem('ql.nick', v); } catch (e) { /* ignore */ }
    closeRename();
    toast('昵称已改为「' + v + '」');
  }

  /* ---------------- 复制 / 邀请 ---------------- */

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  function inviteText() {
    var here = location.href.split('#')[0].split('?')[0];
    if (/^https?:/i.test(here)) {
      return '来「' + APP_NAME + '」和我聊天：\n' + here + '\n房间口令：' + S.room + '\n（打开后填个昵称就能进）';
    }
    return '来「' + APP_NAME + '」和我聊天：\n打开我发给你的 qingliao-chat.html\n房间口令：' + S.room + '\n（填个昵称就能进）';
  }

  /* ---------------- 输入框 / 表情 ---------------- */

  function autoGrow() {
    var el = $('msgInput');
    var atBottom = nearBottom();
    el.style.height = 'auto';
    el.style.height = Math.min(132, el.scrollHeight) + 'px';
    if (atBottom) scrollDown(true);
  }

  function updateCounter() {
    var n = $('msgInput').value.length;
    var el = $('counter');
    if (n >= 650) {
      el.textContent = n + ' / ' + MAX_LEN;
      el.classList.remove('is-hidden');
    } else {
      el.classList.add('is-hidden');
    }
  }

  function submitInput() {
    var el = $('msgInput');
    var text = el.value;
    if (!text.replace(/\s+/g, '')) return;
    el.value = '';
    autoGrow();
    updateCounter();
    toggleEmoji(false);
    sendMessage(text);
  }

  var EMOJIS = ('😀 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 😉 😍 🥰 😘 😋 😜 🤪 🤗 🤔 🤨 😐 😑 😴 🥱 😮 😲 😳 🥺 😢 😭 😤 😡 ' +
    '🤯 😱 😬 🙄 😏 😒 😞 😔 👍 👎 👌 ✌️ 🤞 👏 🙌 🙏 💪 👋 🤝 👀 ❤️ 🧡 💛 💚 💙 💜 💔 💯 🔥 ✨ 🎉 🎊 ✅ ❌ ⚠️ ⏰ 💻 📌 ☕ 🍜').split(' ');

  function buildEmojiPanel() {
    var panel = $('emojiPanel');
    if (!panel || panel.childNodes.length) return;
    for (var i = 0; i < EMOJIS.length; i++) {
      (function (ch) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'emoji';
        b.textContent = ch;
        b.addEventListener('click', function (ev) {
          ev.stopPropagation();
          insertAtCursor(ch);
        });
        panel.appendChild(b);
      })(EMOJIS[i]);
    }
  }

  function insertAtCursor(text) {
    var el = $('msgInput');
    var start = el.selectionStart;
    var end = el.selectionEnd;
    var v = el.value || '';
    if (typeof start !== 'number' || typeof end !== 'number') { start = v.length; end = v.length; }
    el.value = v.slice(0, start) + text + v.slice(end);
    var pos = start + text.length;
    try { el.setSelectionRange(pos, pos); } catch (e) { /* ignore */ }
    el.focus();
    autoGrow();
    updateCounter();
  }

  function toggleEmoji(force) {
    var panel = $('emojiPanel');
    if (!panel) return;
    var show = typeof force === 'boolean' ? force : panel.classList.contains('is-hidden');
    panel.classList.toggle('is-hidden', !show);
  }

  /* ---------------- 启动 ---------------- */

  function boot() {
    if (!$('joinScreen')) return;

    var q = new URLSearchParams(location.search);
    var savedNick = '';
    var savedRoom = '';
    try {
      savedNick = localStorage.getItem('ql.nick') || '';
      savedRoom = localStorage.getItem('ql.room') || '';
    } catch (e) { /* ignore */ }

    $('nickInput').value = q.get('nick') || savedNick;
    $('roomInput').value = q.get('room') || savedRoom || randCode();
    if (savedRoom && $('rememberChk')) $('rememberChk').checked = true;

    $('rollBtn').addEventListener('click', function () {
      $('roomInput').value = randCode();
      $('roomInput').focus();
    });

    $('joinForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      enter();
    });

    $('sendBtn').addEventListener('click', submitInput);

    buildEmojiPanel();
    $('emojiBtn').addEventListener('click', function (ev) {
      ev.stopPropagation();
      toggleEmoji();
    });
    $('emojiPanel').addEventListener('click', function (ev) { ev.stopPropagation(); });

    $('imgBtn').addEventListener('click', function () { $('fileInput').click(); });
    $('fileInput').addEventListener('change', function () {
      var files = this.files ? Array.prototype.slice.call(this.files) : [];
      this.value = '';
      for (var i = 0; i < files.length; i++) sendImage(files[i]);
    });
    document.addEventListener('paste', function (ev) {
      if (!S.entered) return;
      var cd = ev.clipboardData;
      if (!cd || !cd.items) return;
      for (var i = 0; i < cd.items.length; i++) {
        var it = cd.items[i];
        if (it.kind === 'file' && /^image\//.test(it.type || '')) {
          var f = it.getAsFile();
          if (f) { ev.preventDefault(); sendImage(f); return; }
        }
      }
    });

    $('jumpBtn').addEventListener('click', function () {
      resetJump();
      scrollDown(true);
    });
    $('log').addEventListener('scroll', function () {
      if (S.pending && nearBottom()) resetJump();
      closeCtxMenu();
    });

    $('log').addEventListener('contextmenu', function (ev) {
      var wrap = ev.target && ev.target.closest ? ev.target.closest('.msg') : null;
      if (!wrap || !wrap.__msg) return;
      ev.preventDefault();
      openCtxMenu(wrap.__msg, ev.clientX, ev.clientY);
    });

    var lpTimer = null;
    var lpStart = null;
    var lpFired = false;

    $('log').addEventListener('touchstart', function (ev) {
      if (!ev.touches || ev.touches.length !== 1) return;
      var wrap = ev.target && ev.target.closest ? ev.target.closest('.msg') : null;
      if (!wrap || !wrap.__msg) return;
      lpStart = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
      lpFired = false;
      clearTimeout(lpTimer);
      lpTimer = setTimeout(function () {
        lpFired = true;
        openCtxMenu(wrap.__msg, lpStart.x, lpStart.y);
        try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* ignore */ }
      }, 460);
    }, { passive: true });

    $('log').addEventListener('touchmove', function (ev) {
      if (!lpStart || !ev.touches || !ev.touches[0]) return;
      var t = ev.touches[0];
      if (Math.abs(t.clientX - lpStart.x) > 10 || Math.abs(t.clientY - lpStart.y) > 10) {
        clearTimeout(lpTimer);
        lpTimer = null;
        lpStart = null;
      }
    }, { passive: true });

    $('log').addEventListener('touchend', function (ev) {
      clearTimeout(lpTimer);
      lpTimer = null;
      lpStart = null;
      if (lpFired) {
        lpFired = false;
        if (ev.cancelable) ev.preventDefault();
      }
    }, { passive: false });

    $('cmQuote').addEventListener('click', function () {
      var m = ctxMsg;
      closeCtxMenu();
      if (m) startQuote(m);
    });
    $('cmCopy').addEventListener('click', function () {
      var m = ctxMsg;
      closeCtxMenu();
      if (!m) return;
      copyText(String(m.t || '')).then(function (ok) {
        toast(ok ? '已复制这条消息' : '复制失败，请手动选中');
      });
    });
    $('cmRecall').addEventListener('click', function () {
      var m = ctxMsg;
      closeCtxMenu();
      if (m) recallMessage(m);
    });

    $('msgInput').addEventListener('input', function () {
      autoGrow();
      updateCounter();
    });
    $('msgInput').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.keyCode !== 229) {
        ev.preventDefault();
        submitInput();
      }
    });

    $('inviteBtn').addEventListener('click', function () {
      copyText(inviteText()).then(function (ok) {
        toast(ok ? '邀请信息已复制，粘贴给对方即可' : '复制失败，请手动记下房间口令：' + S.room);
      });
    });

    $('reconnectBtn').addEventListener('click', function () {
      if (!S.entered) return;
      S.retry = 0;
      connect();
      toast('正在重新连接…');
    });

    $('leaveBtn').addEventListener('click', function () {
      if (S.entered && !window.confirm('退出当前房间？')) return;
      leave();
    });

    function hideMenu() {
      $('menu').classList.add('is-hidden');
      $('moreBtn').setAttribute('aria-expanded', 'false');
    }
    function setSwitch(el, on) { el.setAttribute('aria-checked', on ? 'true' : 'false'); }

    setSwitch($('notifyItem'), P.notify);
    setSwitch($('soundItem'), P.sound);

    $('moreBtn').addEventListener('click', function (ev) {
      ev.stopPropagation();
      var open = $('menu').classList.contains('is-hidden');
      $('menu').classList.toggle('is-hidden', !open);
      $('moreBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    $('menu').addEventListener('click', function (ev) { ev.stopPropagation(); });

    $('notifyItem').addEventListener('click', function () {
      if (P.notify) {
        P.notify = false;
        setSwitch($('notifyItem'), false);
        savePref();
        toast('已关闭消息提醒');
        return;
      }
      if (!('Notification' in window)) { toast('这个浏览器不支持桌面通知'); return; }
      if (Notification.permission === 'granted') {
        P.notify = true;
        setSwitch($('notifyItem'), true);
        savePref();
        toast('已开启：页面在后台时提醒');
        return;
      }
      if (Notification.permission === 'denied') { toast('通知被浏览器拒绝了，请到浏览器设置里允许'); return; }
      Notification.requestPermission().then(function (perm) {
        if (perm === 'granted') {
          P.notify = true;
          setSwitch($('notifyItem'), true);
          savePref();
          toast('已开启：页面在后台时提醒');
        } else {
          toast('没有拿到通知权限');
        }
      });
    });

    $('soundItem').addEventListener('click', function () {
      P.sound = !P.sound;
      setSwitch($('soundItem'), P.sound);
      savePref();
      if (P.sound) { ensureAudio(); beep(); }
      toast(P.sound ? '已开启提示音' : '已关闭提示音');
    });

    $('miniItem').addEventListener('click', function () {
      hideMenu();
      toggleMini();
    });
    $('miniItem').setAttribute('aria-checked', (pipWin && !pipWin.closed) ? 'true' : 'false');

    if ($('menuNote')) $('menuNote').textContent = '版本 ' + VERSION;

    $('renameItem').addEventListener('click', function () {
      hideMenu();
      openRename();
    });
    $('renameCancel').addEventListener('click', closeRename);
    $('renameOk').addEventListener('click', saveRename);
    $('renameInput').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); saveRename(); }
    });
    $('renameModal').addEventListener('click', function (ev) {
      if (ev.target === $('renameModal')) closeRename();
    });

    $('clearBtn').addEventListener('click', function () {
      if (!window.confirm('清空这台电脑上保存的聊天记录？\n（对方那边不受影响，清空后无法恢复）')) return;
      clearHist();
      hideMenu();
      toast('本机聊天记录已清空');
    });

    $('qbClose').addEventListener('click', function () {
      clearQuote();
      $('msgInput').focus();
    });

    document.addEventListener('click', function (ev) {
      if (!$('menu').classList.contains('is-hidden') &&
          !$('menu').contains(ev.target) && ev.target !== $('moreBtn')) {
        hideMenu();
      }
      toggleEmoji(false);
      closeCtxMenu();
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        hideMenu();
        closeRename();
        closeCtxMenu();
        toggleEmoji(false);
        if (S.quote) clearQuote();
      }
    });

    window.addEventListener('online', function () {
      if (S.entered && !S.connected) connect();
    });
    window.addEventListener('offline', function () {
      if (S.entered) setStatus('offline', '网络已断开');
    });

    if (window.visualViewport) {
      var vv = window.visualViewport;
      var syncViewport = function () {
        var chat = $('chatScreen');
        if (!chat) return;
        if (S.entered && window.innerWidth <= 700) {
          chat.style.height = Math.max(280, Math.round(vv.height)) + 'px';
          scrollDown();
        } else {
          chat.style.height = '';
        }
      };
      vv.addEventListener('resize', syncViewport);
      vv.addEventListener('scroll', syncViewport);
    }

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) {
        clearUnread();
        updateTitle();
        markVisibleRead();
      }
    });
    window.addEventListener('focus', function () {
      clearUnread();
      markVisibleRead();
    });

    if (q.get('go') === '1' && q.get('room') && q.get('nick')) {
      enter();
    } else if (q.get('room')) {
      $('nickInput').focus();
    }

    var fitPlaceholder = function () {
      if (!$('msgInput')) return;
      $('msgInput').placeholder = window.innerWidth < 620
        ? '输入消息…'
        : '输入消息，Enter 发送，Shift + Enter 换行';
    };
    fitPlaceholder();
    window.addEventListener('resize', fitPlaceholder);
  }

  window.__ql = {
    version: VERSION,
    topicFor: topicFor,
    seal: seal,
    unseal: unseal,
    makeKey: makeKey,
    hasCrypto: function () { return HAS_CRYPTO; },
    state: S,
    prefs: P,
    send: sendMessage,
    feed: handleRaw,
    quote: startQuote,
    enter: enter
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      try { boot(); } catch (e) {
        document.body.innerHTML = '<pre style="padding:20px;color:#b3402e">页面启动失败：' + String((e && e.message) || e) + '</pre>';
      }
    });
  } else {
    try { boot(); } catch (e) {
      document.body.innerHTML = '<pre style="padding:20px;color:#b3402e">页面启动失败：' + String((e && e.message) || e) + '</pre>';
    }
  }
})();
</script>
</body>
</html>
